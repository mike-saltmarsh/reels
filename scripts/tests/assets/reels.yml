# Ground truth for the vanilla info here: https://williamvenner.github.io/pz-rm-explorer/
skills:
  combat - firearms:
    aiming:
      vanilla XP: 87.5
    reloading:
      vanilla XP: 87.5
  combat - melee:
    axe:
    long blade:
    long blunt:
      vanilla XP: 12.5
    maintenance:
    short blade:
    short blunt:
    spear:
  crafting:
    blacksmithing:
    carpentry:
      vanilla XP: 625
      reels:
      - key: SMR_Carpentry-E1
        itemDisplayName: "VHS: This Old Trailer E1"
        title: Carpentry
        subtitle: "Episode 1: Whatever"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be dismantling chairs.
          codes:
          - CRP+1
          - BOR-1
        - text: Just go and find any old chair. Don't have one?
        - text: Your neighbor's chair will do just fine.
        - text: The only tools you will need are a hammer and saw.
        - text: Go ahead and saw off the legs and backrest
          codes:
          - CRP+1
          - BOR-1
        - text: Take any good bits and set them to the side.
        - text: Now go ahead and smash it a bit with your hammer.
        - text: Really get in there and smash that seat up.
        - text: Today we're just after firewood. The legs are good.
          codes:
          - CRP+1
          - BOR-1
        - text: So is the backrest. The seat is too big.
        - text: Now once the seat is good and smashed you're done.
        - text: You should have a small bit of wood for your own use.
        - text: As long as you're somewhat skilled anyway.
          codes:
          - CRP+1
          - BOR-1
        - text: The smashed bits make good kindling though!
        - text: Well that's all for today folks!
        - text: Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E2
        itemDisplayName: "VHS: This Old Trailer E2"
        title: Carpentry
        subtitle: "Episode 2: Doors"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking dismantling doors.
          codes:
          - CRP+1
          - BOR-1
        - text: Our tools for this job are a hammer and screwdriver.
        - text: Now these babies are great for getting some experience.
        - text: There are lots of them in your typical house.
        - text: Like your nextdoor neighbor's house for instance.
          codes:
          - CRP+1
          - BOR-1
        - text: You may have to smash a window to get in the house.
        - text: "*glass breaking* But that's okay! Don't get cut going in!"
        - text: Be sure to use a tool and smash the rest of the glass out.
        - text: Now let's go in and open some doors up huh fellas?
          codes:
          - CRP+1
          - BOR-1
        - text: Open up every door in the house, we're going to dismantle them.
        - text: Take your screwdriver and undo the hinges on the door.
        - text: Then go ahead and smash it with your hammer a bunch.
        - text: Now if you're skilled you should have some planks you can use.
          codes:
          - CRP+1
          - BOR-1
        - text: Now that we've gotten rid of some pesky doors,
        - text: It's time to drink all your neighbors beer! Hahaha.
        - text: That's all for today. Remember folks, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E3
        itemDisplayName: "VHS: This Old Trailer E3"
        title: Carpentry
        subtitle: "Episode 3: Planks"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be talking about planks.
          codes:
          - CRP+1
          - BOR-1
        - text: Good for barricading windows and doorways.
        - text: Good for making furniture to store your things in.
        - text: In a pinch you can even use a plank as a weapon!
        - text: They're good at knocking people down in a fight.
          codes:
          - CRP+1
          - BOR-1
        - text: I like to use planks for smashing my neighbor's windows.
        - text: Then I get lots more planks to use for whatever I want!
        - text: Careful not to carry too many at once though.
        - text: They are pretty heavy and you could hurt yourself!
          codes:
          - CRP+1
          - BOR-1
        - text: Be quiet and make multiple trips to avoid problems.
        - text: Or you can always bring a buddy with you to help.
        - text: Now we just need to figure out where to put all these planks.
        - text: But we will talk about that more next episode.
          codes:
          - CRP+1
          - BOR-1
        - text: It's all about storage for planks and more!
        - text: Well that's it for today's show. Hope it was informative.
        - text: Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E4
        itemDisplayName: "VHS: This Old Trailer E4"
        title: Carpentry
        subtitle: "Episode 4: Storage"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking about storage!
          codes:
          - CRP+1
          - BOR-1
        - text: You should have enough skill by now to make something.
        - text: Crates are a good starting point for your storage needs.
        - text: You'll need a hammer, 3 planks and 3 nails for one.
        - text: Go ahead and build it any old place. Mine's in the garage.
          codes:
          - CRP+1
          - BOR-1
        - text: You can also make a small bookcase with 3 planks and 3 nails.
        - text: I keep my collection of HottieZ magazines in mine.
        - text: Need more storage in your kitchen or garage?
        - text: Add some shelves for just 2 plank and 2 nails.
          codes:
          - CRP+1
          - BOR-1
        - text: A double shelf is 2 planks and 4 nails.
        - text: Plenty of storage options for all your needs.
        - text: Go ahead and think up some places in your old trailer,
        - text: and add some storage space wheverever you need it.
          codes:
          - CRP+1
          - BOR-1
        - text: You can never have enough storage for all your planks.
        - text: Or whatever else you're collecting out there.
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E5
        itemDisplayName: "VHS: This Old Trailer E5"
        title: Carpentry
        subtitle: "Episode 5: Barricading"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking about barricading with planks!
          codes:
          - CRP+1
          - BOR-1
        - text: Have you got lots of planks and nothing to use them on?
        - text: Barricade your windows and any doorways you don't use!
        - text: It's very handy at keeping the cops out of your old trailer.
        - text: Or any pesky neighbors poking around asking about their stuff.
          codes:
          - CRP+1
          - BOR-1
        - text: You'll need a hammer and a bunch of nails for this job.
        - text: And of course lots of planks. You should have plenty by now.
        - text: If not go pay one of your neighbors a visit and get some.
        - text: You can fit 4 planks over each window. You need 2 nails each.
          codes:
          - CRP+1
          - BOR-1
        - text: Go ahead and barricade up all your windows in your trailer.
        - text: If you have a backdoor go ahead and barricade that too.
        - text: We don't want anyone sneaking in and attacking from behind.
        - text: All barricaded up? Good! Now we can relax and drink some beer.
          codes:
          - CRP+1
          - BOR-1
        - text: My neighbor generously donated this 18 pack here.
        - text: Nothing in this world better than free beer! Hahaha.
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E6
        itemDisplayName: "VHS: This Old Trailer E6"
        title: Carpentry
        subtitle: "Episode 6: Nail Bat"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be making something special, a nail bat.
          codes:
          - CRP+1
          - BOR-1
        - text: This weapon will serve you well in this crazy world.
        - text: Very handy and easy to make. Just a bat with nails in it!
        - text: All you need is your hammer, 5 nails and a baseball bat.
        - text: Now if you don't have a bat, sporting good stores are great places!
          codes:
          - CRP+1
          - BOR-1
        - text: I'm sure you have one nearby you can borrow a bat from.
        - text: Go ahead and hammer the nails in the top of the bat like so.
        - text: Make sure they're nice and straight for extra stabby power!
        - text: Now give it a few swings and see how it feels. Good right?
          codes:
          - CRP+1
          - BOR-1
        - text: Careful not to hit yourself. That will leave a mark. Haha.
        - text: Now you're armed up if any pesky neighbors come around.
        - text: Nobody is going to steal your stash of planks now!
        - text: All of us at This Old Trailer hope you picked up some skills,
          codes:
          - CRP+1
          - BOR-1
        - text: watching us smash up our neighbor's house for planks.
        - text: Keep an eye out for our next show This Old Generator!
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
    carving:
    cooking:
      vanilla XP: 487.5
      reels:
      - key: SMR_Cooking-E1
        itemDisplayName: "VHS: Cooking With Gas E1"
        title: Cooking
        subtitle: "Episode 1: BBQ Is Best!"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: I love a good grilled meat, it's the best.
        - text: You can grill so many different kinds of food it's insane!
        - text: Did you know you can grill a Pot of Soup?
        - text: Grilled Pancakes?! Yes sir! With butter and syrup!
          codes:
          - COO+1
          - BOR-1
        - text: You can even grill up some tea on a cold night.
        - text: I even use my grill to cook my bread and pies.
        - text: Just about anything is possible when you are
        - text: Cooking With Gas! Let your imagination soar!
          codes:
          - COO+1
          - BOR-1
        - text: Lets get a Propane Tank hooked up to the grill...
        - text: Hey Roger have you seen where my Propane Tank went?
        - text: "Roger Offscreen: Nope haven't seen it. Sorry dude."
        - text: Well shoot. Good thing we have a few spares around.
          codes:
          - COO+1
          - BOR-1
        - text: When you're Cooking With Gas you'll want to keep spares.
        - text: Here at The Homestead we have lots of gas. Especially Rodney.
        - text: "Rodney Offscreen: Shut up dude I don't fart that much."
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E2
        itemDisplayName: "VHS: Cooking With Gas E2"
        title: Cooking
        subtitle: "Episode 2: Soup"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're going to grill up a bit Pot of Soup.
        - text: Now because we live on The Homestead we have lots of raw
        - text: ingredients for our soup. Roger is a Farmer. He grows lots.
        - text: So we have broccoli, cabbage, carrot, potato, tomato and radish.
          codes:
          - COO+1
          - BOR-1
        - text: You'll only have room for 6 ingredients and each one is important.
        - text: Your ingredients will make your Pot of Soup better for you,
        - text: So you want to have a healthy variety of ingredients.
        - text: You can also throw in some meat, or if you're low on that
          codes:
          - COO+1
          - BOR-1
        - text: you can use some Dry Ramen, or Canned Vegetables.
        - text: If we get our hands on them we like to use Bell Peppers and Cheese.
        - text: Your Pot of Soup will take 50 minutes to cook. Burns in 100 minutes.
        - text: So keep an eye on your grill! You don't want to waste any food!
          codes:
          - COO+1
          - BOR-1
        - text: Here on The Homestead we use everything we get our hands on.
        - text: Survivalist Skills work well together in keeping your group fed.
        - text: You'll have to do all you can to keep fed as well.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E3
        itemDisplayName: "VHS: Cooking With Gas E3"
        title: Cooking
        subtitle: "Episode 3: Stew"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're cooking up a pot of Fish and Cabbage Stew!
        - text: Rodney came back with a bunch of fish so we have meat!
        - text: Thanks to Roger we have good cabbages this season.
        - text: All we need is a study Cooking Pot, same as with making soup.
          codes:
          - COO+1
          - BOR-1
        - text: You'll need 1 and a half Fish Fillet and same for cabbage.
        - text: Throw that in a pot of water and let it cook for 70 minutes.
        - text: This meal is great when you're Hungry and it can help with Thirst.
        - text: With this Stew you will have enough to share with a friend.
          codes:
          - COO+1
          - BOR-1
        - text: Which is good because your friends will have interesting ingredients!
        - text: Think up some good Stew combinations! You can use a lot of stuff.
        - text: Bacon, Steak, Meat Patty, Beef Jerky. You can even get a bit more
        - text: out of ingredients that are going stale with Stews! Soups too!
          codes:
          - COO+1
          - BOR-1
        - text: Don't use anything Rotten though, unless you're a really skilled Cook.
        - text: You'll only be able to save small amounts of Rotting foods to use.
        - text: So they may not be worth the effort if you have something else.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E4
        itemDisplayName: "VHS: Cooking With Gas E4"
        title: Cooking
        subtitle: "Episode 4: Stir Fry"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we are going to make some Stir Fry with Rabbit Meat!
        - text: Wayne brought us some rabbit meat even though he is scared of rabbits.
        - text: "Wayne Offscreen: I'm not scared of the rabbits. I'm scared of Rabies dude."
        - text: Fair enough. Rabies is scary. I wouldn't want to catch anything like it.
          codes:
          - COO+1
          - BOR-1
        - text: For this dish you want to be cooking with a Frying Pan.
        - text: Go ahead and throw in your Rabbit Meat first and pick out your vegetables.
        - text: Today we've got Leek, Onion and Zuccini to go in our Rabbit Meat Stir Fry.
        - text: Go ahead and grill it up until the Rabbit Meat is safe to eat.
          codes:
          - COO+1
          - BOR-1
        - text: Now you can enjoy a good hearty meal with friends.
        - text: You can use plenty of ingredients in your Stir Fry.
        - text: Lots of different meats and veggies can be added.
        - text: You can even use Frog Meat in your Stir Fry. We have before.
          codes:
          - COO+1
          - BOR-1
        - text: You know around here we do the Subsistence living.
        - text: Our meat is from hunting, or veggies from growing.
        - text: We're just a bunch of old Survivalists making do.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E5
        itemDisplayName: "VHS: Cooking With Gas E5"
        title: Cooking
        subtitle: "Episode 5: Pancakes"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: I eat a lot of Soup and Stew out here on The Homestead.
        - text: Something I don't get a chance to make a lot are Pancakes.
        - text: Pancakes are magical and yes you absolutely can grill them!
        - text: I'll let you in on a little secret I found out recently too.
          codes:
          - COO+1
          - BOR-1
        - text: Even ghosts like to grill up some Pancakes. I've seen it.
        - text: The guys and I have been out all day and come home to some
        - text: mysterious Pancakes already sitting on the grill waiting.
        - text: We all swear up and down it wasn't us that did it.
          codes:
          - COO+1
          - BOR-1
        - text: It is a nice surprise though to come home to grilled Pancakes.
        - text: And I believe the guys that they're not making the Pancakes.
        - text: They don't ever do any Cooking. That's my job and they're lazy.
        - text: I'm not making them, as much as I love grilling Pancakes.
          codes:
          - COO+1
          - BOR-1
        - text: I just don't have the ingredients to make them that often!
        - text: But I do appreciate the Pancake making Ghosts though.
        - text: Been starving more than once after a run and come home to easy Pancakes.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E6
        itemDisplayName: "VHS: Cooking With Gas E6"
        title: Cooking
        subtitle: "Episode 6: Drinks"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're doing something different. We're making drinks!
        - text: Now this drink is a great one to make on a hard day.
        - text: Say you come back from a run and you're a bit stressed.
        - text: What you need is a Hot Cuppa. Yessir it will fix you right up.
          codes:
          - COO+1
          - BOR-1
        - text: You can use either Coffee or Tea Bags. You're gonna need Sugar.
        - text: Now we don't keep a lot of Sugar on hand so it's a rare treat.
        - text: Go ahead and fill a Kettle full of water and let it grill.
        - text: You want hot water for your Cuppa Coffee or Tea.
          codes:
          - COO+1
          - BOR-1
        - text: Once that water is nice and hot take an Empty Mug and some Sugar
        - text: to the grill and fix up a Hot Cuppa to enjoy and fix you up.
        - text: You can always make a Cold Cuppa but I don't see why you would.
        - text: When you're Cooking With Gas your food and drink are always hot!
          codes:
          - COO+1
          - BOR-1
        - text: Now if you have a bunch of Sugar I suggest you make this stuff often.
        - text: It will keep you warm and happy, and hopefully a little more stress free.
        - text: So you can spend more time Cooking With Gas!
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
    electrical:
      vanilla XP: 150
      reels:
      - key: SMR_Electrical-E1
        itemDisplayName: "VHS: This Old Generator E1"
        title: Electrical
        subtitle: "Episode 1: Dismantling Lights"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're going to be talking about dismantling lights.
        - text: Your neighbor's house is full of lamps just waiting for you.
        - text: Go over there and dismantle some. All you need is a screwdriver.
        - text: We talked about getting in safely on This Old Trailer, remember?
          codes:
          - ELC+1
          - BOR-1
        - text: Once you're in there stay quiet so you don't alert any neighbors.
        - text: Dismantle some lights and be sure to keep all the light bulbs.
        - text: You will need those bulbs for making your own electronics later!
        - text: Now you may need a hammer for some of the lights attached onto walls.
          codes:
          - ELC+1
          - BOR-1
        - text: There is lots of stuff out there to dismantle for parts so keep an eye out.
        - text: All of those parts will help a lot in crafting your own gadgets.
        - text: So be sure to dismantle everything you can and save up supplies!
        - text: You never know when you will need a motion activated pipe bomb.
          codes:
          - ELC+1
          - BOR-1
        - text: Next episode we're going to talk about radios and their parts!
        - text: That's all for today! We'll see you next time!
        - text: Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E2  
        itemDisplayName: "VHS: This Old Generator E2"
        title: Electrical
        subtitle: "Episode 2: Dismantling Radios"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're going to be talking about radios and parts.
        - text: There are lots of radios out there so no need to dismantle your own.
        - text: Go fetch your neighbor's radio and get out your trusty screwdriver.
        - text: Lets get started taking this radio apart. There are lots of good parts here.
          codes:
          - ELC+1
          - BOR-1
        - text: Aluminum, good for making hats and other stuff. Some electric wire here.
        - text: A bit of electronic scrap. The guts for all our gadgets so keep every scrap of it!
        - text: Now if you've got some skill you should be able to salvage the receiver. We got one here.
        - text: These are good for remote triggers and fixing up your own radios in your trailer.
          codes:
          - ELC+1
          - BOR-1
        - text: I'm saving up some to make remote pipe bombs to protect my plank stash.
        - text: Now you should also get some batteries out of the radios you dismantle.
        - text: Toss the dead ones but keep every good battery you find. You will need them.
        - text: Nothing worse than wanting to listen to your radio and not having any batteries.
          codes:
          - ELC+1
          - BOR-1
        - text: You may also get an Amplifier if you're a skilled electrician. Keep it.
        - text: Those are good for noise makers to distract any pesky neighbors.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E3
        itemDisplayName: "VHS: This Old Generator E3"
        title: Electrical
        subtitle: "Episode 3: Dismantling TVs"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're talking about dismantling TVs for parts.
        - text: Much like radios, we've got a bunch of good parts available.
        - text: No need to mess up your own TV, go get your neighbor's TV.
        - text: All you'll need is your trusty screwdriver for this job.
          codes:
          - ELC+1
          - BOR-1
        - text: Start taking that TV apart for all those electronic scraps!
        - text: You'll get more aluminum, electric wire and maybe an amplifier!
        - text: Don't forget to keep those electronic scraps safe in your stash.
