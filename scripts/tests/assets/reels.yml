        - text: And Wayne will find you out there in the trees while he's hunting.
        - text: It wouldn't be the first time that's happened, man. Wayne travels.
        - text: Wayne is usually armed though and can take care of himself though, man.
          codes:
          - FOR+1
          - BOR-1
        - text: He hunts at night and goes way out into the forest by himself.
        - text: I go out that far sometimes but usually it's the Mushrooms, man.
        - text: They lead you places and you just go with the flow for sure.
        - text: It's mystical, man. You can't explain it. You just feel it.
          codes:
          - FOR+1
          - BOR-1
        - text: The Magic of Mushrooms!
          icon: music
      - key: SMR_Foraging-E6
        itemDisplayName: "VHS: The Magic of Mushrooms E6"
        title: Foraging
        subtitle: "Episode 6: Don't Get Lost"
        lines:
        - text: The Magic of Mushrooms!
          icon: music
        - text: Hey man welcome to The Magic of Mushrooms!
        - text: The show where we go out looking for Good Mushrooms!
          codes:
          - FOR+1
          - BOR-1
        - text: I'm Willie and I pick Mushrooms for a living, man.
        - text: I've been seeing lots of people out in the forest lately, man.
        - text: A bunch of them look like they're lost out there but it's weird.
        - text: They're all in a group but they don't seem to like other people.
          codes:
          - FOR+1
          - BOR-1
        - text: Maybe it's just the Mushrooms but I swear I heard them growling, man.
        - text: They're not out there looking for Mushrooms that's for sure.
        - text: They don't come around any of my spots, man. They don't want Mushrooms.
        - text: They get mad about loud noises and go look for the sound.
          codes:
          - FOR+1
          - BOR-1
        - text: I just leave them all alone, man. They seem to like company.
        - text: But it made me remember to tell you all, don't get lost out here.
        - text: Yeah, man. You can get lost easily looking for Mushrooms.
        - text: They can grow anywhere so you travel a lot to find them.
          codes:
          - FOR+1
          - BOR-1
        - text: I'm lucky because Wayne always ends up near me out there, man.
        - text: It's like he's tracking me like one of his rabbits, man. Haha.
        - text: Nice to know he's there in the wild with me though.
        - text: Even if he gets mad at me when we bump into each other out there.
          codes:
          - FOR+1
          - BOR-1
        - text: The Magic of Mushrooms!
          icon: music

    tracking:
    trapping:
      vanilla XP: 125
      reels:
      - key: SMR_Trapping-E1
        itemDisplayName: "VHS: Man vs Rabies E1"
        title: Trapping
        subtitle: "Episode 1: Traps"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: Hi My name is Wayne and welcome to Man vs Rabies!
        - text: I'm here to teach you how to catch rabbits and not rabies!
          codes:
          - TRA+1
          - BOR-1
        - text: Now trapping is a great way to get yourself some meat.
        - text: You'll primarily be after Rabbit and Squirrel.
        - text: If you're in a pinch though you may have to eat birds. Or mice.
        - text: This should be pretty safe. There haven't been any documented cases
          codes:
          - TRA+1
          - BOR-1
        - text: of rabies from eating properly cooked animals. It's from saliva, so bites.
        - text: Like an rational adult I'm terrified of rabies. It's a death sentence.
        - text: We're out in the boonies on The Homestead so a hospital may be too far away.
        - text: We'll be trapping deep in the wilderness too so we need to be careful.
          codes:
          - TRA+1
          - BOR-1
        - text: Now your traps effectiveness depends on it's strength. Sturdy is better.
        - text: But there's nothing wrong with home-made traps for trapping game.
        - text: You can learn some effective traps from issues of The Hunter Magazine.
        - text: Snare Traps, Stick Traps, Box Traps and Crate Traps. All useful.
          codes:
          - TRA+1
          - BOR-1
        - text: With more skill you can make Cage Traps from 5 Wires.
        - text: Good traps for catching Rabbits which is what we want.
        - text: Squirrels aren't bad either though. Meat is meat.
        - text: That's all for now. Next time we'll talk Bait.
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
      - key: SMR_Trapping-E2
        itemDisplayName: "VHS: Man vs Rabies E2"
        title: Trapping
        subtitle: "Episode 2: Bait"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: Hi My name is Wayne and welcome to Man vs Rabies!
        - text: I'm here to teach you how to catch rabbits and not rabies!
          codes:
          - TRA+1
          - BOR-1
        - text: Today we're talking about bait and how to use it effectively.
        - text: Each critter's tastes are a bit different so you variety.
        - text: Squirrels like cereal, nuts and popcorn the most.
        - text: Mice and rats love cheese, nuts and chocolate.
          codes:
          - TRA+1
          - BOR-1
        - text: Birds like bread, cereal and corn.
        - text: The rabbit's we're after love vegetables.
        - text: Roger back at The Homestead grows vegetables for us.
        - text: Perfect for our purposes. Bit of extra supplies rabbits.
          codes:
          - TRA+1
          - BOR-1
        - text: Now you want to use fresh bait but some stale stuff works.
        - text: Critters won't go for anything rotten. You wouldn't either.
        - text: So your bait will determine what you're trapping.
        - text: Plan accordingly, keep your traps ready and you will do fine.
          codes:
          - TRA+1
          - BOR-1
        - text: It doesn't hurt to have friends with vegetables.
        - text: More than that because Rodney always has chocolate. Hahaha.
        - text: Also remember in a pinch you can bait for birds with worms!
        - text: That's all for now. Next time we'll talk Location.
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
      - key: SMR_Trapping-E3
        itemDisplayName: "VHS: Man vs Rabies E3"
        title: Trapping
        subtitle: "Episode 3: Locations"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: Hi My name is Wayne and welcome to Man vs Rabies!
        - text: I'm here to teach you how to catch rabbits and not rabies!
          codes:
          - TRA+1
          - BOR-1
        - text: Today we're talking about effective trapping locations.
        - text: Each critter is a bit different and prefer different spots.
        - text: The rabbits we're going after are in the Deep Forest.
        - text: You can find some closer to town but not as many.
          codes:
          - TRA+1
          - BOR-1
        - text: The same with Squirrels. Deep Forest is the place.
        - text: Now if you're in a pinch and need quick meat,
        - text: You can find mice and birds near Farms and Towns.
        - text: Your time of day also determines what you catch!
          codes:
          - TRA+1
          - BOR-1
        - text: Rabbits and Squirrels are nocturnal so trap at night.
        - text: Between the hours of 19:00 and 5:00 for these two.
        - text: Birds and mice are active all day long.
        - text: So if you're in a pinch for meat don't wait.
          codes:
          - TRA+1
          - BOR-1
        - text: Go out and set up some traps. Check them hourly.
        - text: I almost forgot! You want your traps in hidden spots.
        - text: If you or other people hang around animals won't go near.
        - text: And your traps might get trampled and broken to pieces!
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
      - key: SMR_Trapping-E4
        itemDisplayName: "VHS: Man vs Rabies E4"
        title: Trapping
        subtitle: "Episode 4: I Lost My Traps"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: Hi My name is Wayne and welcome to Man vs Rabies!
        - text: I'm here to teach you how to catch rabbits and not rabies!
          codes:
          - TRA+1
          - BOR-1
        - text: Today we're both learning an important lesson.
        - text: I lost my traps because I was too proud to leave markers.
        - text: I didn't want anyone following me to my trapping spots.
        - text: I keep bumping into Willie out here looking for Mushrooms.
          codes:
          - TRA+1
          - BOR-1
        - text: I don't want him to scare away all the prey in the area.
        - text: He means well but he's an old bird brain. A human crow.
        - text: He'll see the shine of those Cage Traps from a mile away,
        - text: and then go touch them to find out what they are.
          codes:
          - TRA+1
          - BOR-1
        - text: Enough about that though. I lost the exact spot I was in.
        - text: So from now on I'm going to be placing markers for my traps.
        - text: Some kind of trail I can follow back to good trapping locations.
        - text: I'd rather get some meat and bump into Willie more than starve.
          codes:
          - TRA+1
          - BOR-1
        - text: I wonder what kind of cheap markers I can make out here?
        - text: Worth thinking about. I'll have to check my supplies at home.
        - text: No use in wandering around aimlessly out here in the wild.
        - text: Time to go back to The Homestead for more traps, and some markers.
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
      - key: SMR_Trapping-E5
        itemDisplayName: "VHS: Man vs Rabies E5"
        title: Trapping
        subtitle: "Episode 5: Frequent Visitors"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: Hi My name is Wayne and welcome to Man vs Rabies!
        - text: I'm here to teach you how to catch rabbits and not rabies!
          codes:
          - TRA+1
          - BOR-1
        - text: So I'm starting to think the markers were a bad idea.
        - text: I'm bumping into a lot more people out here lately.
        - text: I'm not the only one trapping and it's noticeable.
        - text: Something must be driving folks out here.
          codes:
          - TRA+1
          - BOR-1
        - text: We live out in the backwoods here but to be honest,
        - text: you don't see that many people trapping anymore.
        - text: Us at The Homestead made the choice to live small.
        - text: It really has me wondering what's going on.
          codes:
          - TRA+1
          - BOR-1
        - text: Regular folks out here subsisting on rabbit,
        - text: just feels like a bad omen for the future.
        - text: It's hopefully nothing really bad and just
        - text: some economic woes having people a bit hungry.
          codes:
          - TRA+1
          - BOR-1
        - text: We should stop worrying I guess and focus.
        - text: Lets go check some traps and see what we got.
        - text: "*leaves rustling violently*"
        - text: Hey! Who's there? Willie is that you?
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
      - key: SMR_Trapping-E6
        itemDisplayName: "VHS: Man vs Rabies E6"
        title: Trapping
        subtitle: "Episode 6: Professional Trapping"
        lines:
        - text: Man vs Rabies!
          icon: music
        - text: "Willie: Hey has anyone seen Wayne today?"
        - text: "Roger: No. He was out trapping yesterday."
          codes:
          - TRA+1
          - BOR-1
        - text: "Roger: Maybe he got lost or something."
        - text: "Willie: No that's not like him at all."
        - text: "Willie: He usually finds ME out there man."
        - text: "Rodney: I saw him trapping out by Riverside."
          codes:
          - TRA+1
          - BOR-1
        - text: "Rodney: He looked a bit weird. Just kinda off."
        - text: "Rodney: His shirt had a hole in it."
        - text: "Rodney: He looked a bit confused when I waved."
        - text: "Rodney: Didn't look wounded or anything."
          codes:
          - TRA+1
          - BOR-1
        - text: "Willie: Sounds like bad Mushrooms man."
        - text: "Roger: He doesn't eat Mushrooms."
        - text: "Willie: Oh yeah man I forgot."
        - text: "Willie: I'm the only one who eats the Mushrooms."
          codes:
          - TRA+1
          - BOR-1
        - text: "Roger: He's missing the taping of his last episode."
        - text: "Rodney: That's okay he can tape over this later."
        - text: "Roger: Yeah probably the first thing he does."
        - text: "Roger: He has been gone a while though."
          codes:
          - TRA+1
          - BOR-1
        - text: Man vs Rabies!
          icon: music
