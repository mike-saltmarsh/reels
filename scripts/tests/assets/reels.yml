        - text: But you'll also need a Jack, Tire Pump and Lug Wrench.
          codes:
          - MEC+1
          - BOR-1
        - text: If you're new to the craft, start with reinstalling lights, batteries and radios.
        - text: Work on junkers and vehicles you don't care about. Don't just stick to one!
        - text: Working the same model over and over won't teach you much so go hog wild.
        - text: Stuff is going to break and you're going to end up with some parts along the way.
          codes:
          - MEC+1
          - BOR-1
        - text: Stockpile really good parts and use the rest as fodder for gaining experience!
        - text: Tear up all the old cars on your block down to scraps if nobody's using them!
        - text: Just make sure you do it the Ill Eagle way, quick and quiet.
        - text: Well that's the end of our episode today. Tune in next time!
          codes:
          - MEC+1
          - BOR-1
        - text: Ill Eagle Engines!
          icon: music
