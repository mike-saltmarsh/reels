        - text: Welcome back to Wheels, Kilns, and Clay.
        - text: I am Susan Peterson, your guide to ceramics.
          codes:
          - POT+1
          - BOR-1
        - text: Today we make our fired pottery waterproof.
        - text: An unglazed pot will leak your drinking water.
        - text: The wandering dead are still outside our door.
        - text: But we must focus on the chemistry of glaze.
          codes:
          - POT+1
          - BOR-1
        - text: Clean your wooden crafting table before we start.
        - text: Gather fine wood ash from your cold campfire.
        - text: Mix the gray ash with wet, mineral-rich clay.
        - text: Grind them together with a stone pestle.
          codes:
          - POT+1
          - BOR-1
        - text: Add water to make a smooth, liquid paste.
        - text: Dip your dry clay cups and bowls into the mix.
        - text: This mixture melts into a protective glass coat.
        - text: Fire your glazed vessels in a very hot kiln.
          codes:
          - POT+1
          - BOR-1
        - text: Always keep your hammer close while you work.
        - text: Soon you will have safe, clean water storage.
        - text: Stay safe in Kentucky and keep practicing.
        - text: Join us next time on Wheels, Kilns, and Clay.
          codes:
          - POT+1
          - BOR-1
        - text: "Pottery: Wheels, Kilns, and Clay!"
          icon: music
      - key: SMR_Pottery-E6
        itemDisplayName: "Pottery: Wheels, Kilns, and Clay E6"
        title: Pottery
        subtitle: "Episode 6: Master of the Flame"
        lines:
        - text: "Pottery: Wheels, Kilns, and Clay!"
          icon: music
        - text: Welcome back to Wheels, Kilns, and Clay.
        - text: I am Susan Peterson, your guide to ceramics.
          codes:
          - POT+1
          - BOR-1
        - text: Today we master the heat of the fire itself.
        - text: Deep in Kentucky, the dead are still hunting us.
        - text: But we must focus on reaching high temperatures.
        - text: Place your glazed stoneware inside the brick kiln.
          codes:
          - POT+1
          - BOR-1
        - text: You must control the draft to raise the flame.
        - text: Stack dry hardwood and seal the kiln door tight.
        - text: Watch the color of the heat through the peephole.
        - text: We need a bright orange glow to melt the glaze.
          codes:
          - POT+1
          - BOR-1
        - text: This extreme heat fuses clay into durable stone.
        - text: Do not let the fire die out too quickly today.
        - text: Keep your trusty shotgun loaded just in case.
        - text: This stoneware will hold your clean drinking water.
          codes:
          - POT+1
          - BOR-1
        - text: Safe water is how we survive another winter.
        - text: Practice your craft and keep the safehouse secure.
        - text: Join us next time for more pottery lessons.
        - text: Stay safe in Kentucky and happy potting.
          codes:
          - POT+1
          - BOR-1
        - text: "Pottery: Wheels, Kilns, and Clay!"
          icon: music

    tailoring:
      vanilla XP: 150
      reels:
      - key: SMR_Tailoring-E1
        itemDisplayName: "VHS: Patch Perfect E1"
        title: Tailoring
        subtitle: "Episode 1: Thread"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Today we're talking about thread.
        - text: You can't do any tailoring without the stuff.
        - text: So where do you get it? You can find it in stores and sheds.
        - text: If you're skilled at Tailoring you can also get some back
          codes:
          - TAI+1
          - BOR-1
        - text: when you tear up old clothes for some materials.
        - text: So you will want to get as much experience as possible.
        - text: The best way to do that is just patch up clothing!
        - text: Practice by patching up that shirt full of holes.
          codes:
          - TAI+1
          - BOR-1
        - text: Now take the patches off and do it again and again.
        - text: It's not very much fun but you will gain experience.
        - text: The more skilled you are in Tailoring the better you patch clothes.
        - text: And remember if you have extra clothes you aren't going to need
          codes:
          - TAI+1
          - BOR-1
        - text: tear them up for thread so you can have a stockpile.
        - text: I like to sneak into public laundromats and steal clothes to tear up.
        - text: That way I'm not tearing up my own clothes all the time.
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
      - key: SMR_Tailoring-E2
        itemDisplayName: "VHS: Patch Perfect E2"
        title: Tailoring
        subtitle: "Episode 2: Needles"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Today we're talking about needles.
        - text: You can find these in medicine cabinets inside houses.
        - text: If you don't have a needle already go searching.
        - text: I'm sure your neighbors won't mind you checking their bathrooms.
          codes:
          - TAI+1
          - BOR-1
        - text: You can also find them in Sewing Kits, which come with thread!
        - text: So definitely keep an eye out for any Sewing Kits to take home.
        - text: I don't pass up a single one because free thread is so great!
        - text: It also helps to have the extra needles around since they're small.
          codes:
          - TAI+1
          - BOR-1
        - text: They're easy to lose so having an extra will come in handy in a pinch.
        - text: Once you have a good supply of needle and thread it's time to get to work.
        - text: Patch up every piece of clothing in sight. Steal some to patch up!
        - text: All the hustle and bustle of life will give you plenty of clothing to patch.
          codes:
          - TAI+1
          - BOR-1
        - text: With time and patience you'll master Tailoring and always look stylish
        - text: while your friends look like bums. Well my friends ARE bums but that's beside the point.
        - text: You bunch of bums! You know who you are!
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
      - key: SMR_Tailoring-E3
        itemDisplayName: "VHS: Patch Perfect E3"
        title: Tailoring
        subtitle: "Episode 3: Ripped Sheets"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Today we're talking about Ripped Sheets.
        - text: Just your standard cotton material from clothes and sheets.
        - text: This stuff is your standard material for patching clothes cheap.
        - text: It won't offer very much added protection since it's lightweight.
          codes:
          - TAI+1
          - BOR-1
        - text: It could save you from a bad scratch though. It could get infected!
        - text: Using cloth patches won't have your clothes looking brand new,
        - text: but it's a great starting point to learn patching.
        - text: And it's certainly much better than running around like a weirdo
          codes:
          - TAI+1
          - BOR-1
        - text: wearing bloody, dirty rags and raving about Scrap Metal.
        - text: Now you really shouldn't have to work hard for a stockpile of cloth.
        - text: We talked about ripping up stuff last episode for thread.
        - text: You'll be getting lots of cloth as a byproduct in your quest for thread.
          codes:
          - TAI+1
          - BOR-1
        - text: As long as you're not slacking you will be overflowing with cloth!
        - text: In the next episode we'll talk about better patching materials
        - text: and how you can get them for your Tailoring supply stockpile!
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
      - key: SMR_Tailoring-E4
        itemDisplayName: "VHS: Patch Perfect E4"
        title: Tailoring
        subtitle: "Episode 4: Denim Strips"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Today we're talking about Denim Strips.
        - text: This is your middle of the road patching material.
        - text: You can get this stuff by cutting up Denim clothes.
        - text: You'll need a pair of scissors with you for this.
          codes:
          - TAI+1
          - BOR-1
        - text: When I need more Denim Strips I visit my local laundromat.
        - text: You can also visit a clothing store for Denim clothes.
        - text: Either place should have some denim for you.
        - text: Save up this stuff since it's rarer than Cotton clothes.
          codes:
          - TAI+1
          - BOR-1
        - text: You'll want to save these patches for important clothing.
        - text: Stuff you want extra protection on, or something that is
        - text: made of denim itself. We'll talk about that in the future!
        - text: So go out there and cut up some denim for your stockpile.
          codes:
          - TAI+1
          - BOR-1
        - text: It's a very small and lightweight material.
        - text: That makes storage and transport a breeze!
        - text: In the next episode we're going to talk about high end patches.
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
      - key: SMR_Tailoring-E5
        itemDisplayName: "VHS: Patch Perfect E5"
        title: Tailoring
        subtitle: "Episode 5: Leather Strips"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Today we're talking about Leather Strips.
        - text: This is our high end patching material and important stuff.
        - text: You do not want to waste this material on junk clothing.
        - text: You get Leather Strips by cutting up Leather jackets.
          codes:
          - TAI+1
          - BOR-1
        - text: Once again you'll be using your scissors so keep them handy.
        - text: You're only going to get this material from Leather jackets
        - text: It's not something you're going to have a lot of on hand.
        - text: So it's really important that you save these patches.
          codes:
          - TAI+1
          - BOR-1
        - text: Use them on Leather jackets you want to keep repaired.
        - text: Now if you find yourself with lots of spare patches,
        - text: go ahead and use them for the added protection.
        - text: Leather is really strong against bites if you find yourself
          codes:
          - TAI+1
          - BOR-1
        - text: in that part of town on a Saturday night looking for supplies.
        - text: Every time I go by Jim-Bob's Trailer he tries to bite me.
        - text: I'm only looking for Thread, Jim-Bob. Stop attacking me for planks!
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
      - key: SMR_Tailoring-E6
        itemDisplayName: "VHS: Patch Perfect E6"
        title: Tailoring
        subtitle: "Episode 6: High Level Tailoring"
        lines:
        - text: Patch Perfect
          icon: music
        - text: Hello my name is Ruby and you're watching Patch Perfect!
        - text: The show where we teach you how to patch up your wardrobe!
          codes:
          - TAI+1
          - BOR-1
        - text: Did you know that a skilled Tailor can completely repair clothing?
        - text: That's right! At Level 8 Tailoring and with the correct fabric
        - text: you can completely repair holes in your clothing! So wonderful!
        - text: Now this isn't easy to achieve and I bet you realize that by now.
          codes:
          - TAI+1
          - BOR-1
        - text: Getting good at Tailoring is a lot of work and none of it is very fun.
        - text: But the rewards are massive! You can keep your wardrobe looking Patch Perfect!
        - text: My friends are always jealous of my stylish and beautiful clothing.
        - text: Those bums just run around in rags all the time. I patch them up a lot.
          codes:
          - TAI+1
          - BOR-1
        - text: It's good experience even for a Level 8 Tailor on their way to the top.
        - text: So keep up the patchwork and striving for that Patch Perfect look!
        - text: The better you get the more stylish you look until you're Patch Perfect!
        - text: If I can make Daryl look respectable then you should have no issues.
          codes:
          - TAI+1
          - BOR-1
        - text: Trust me on that. Daryl is a mess. He's constantly ripping his clothes.
        - text: I guess that's life when you work with sharp metal.
        - text: I prefer the Patch Perfect lifestyle myself. The only thing sharp is my outfit!
        - text: Well that's it for now! Have a Patch Perfect day!
          codes:
          - TAI+1
          - BOR-1
        - text: Patch Perfect
          icon: music
    welding:
      vanilla XP: 225
      reels:
      - key: SMR_Welding-E1
        itemDisplayName: "VHS: Scrap Metal Maniac E1"
        title: Welding
        subtitle: "Episode 1: Car Wrecks"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: Today we're scrapping wrecked cars for materials.
          codes:
          - MTL+1
          - BOR-1
        - text: If your neighborhood is anything like mine there are plenty.
        - text: Now luckily we don't have to go far today,
        - text: someone crashed outside my house earlier and left their car.
        - text: Mind the blood and broken glass, you don't want to get hurt.
          codes:
          - MTL+1
          - BOR-1
        - text: For dismantling cars you need a propane torch and welding mask.
        - text: The mask is important so search garages, storage units and factories.
        - text: You don't want to go blind trying to weld! Trust me on that.
        - text: Take your torch and start stripping the car for good parts.
          codes:
          - MTL+1
          - BOR-1
        - text: You'll get some sheet metal, metal bars and metal pipes.
        - text: All good stuff you will need for welding up your own goods.
        - text: You can make chairs, doors, storage fences and gates.
        - text: Far more sturdy than wooden stuff. Don't tell Jim-Bob I said that.
          codes:
          - MTL+1
          - BOR-1
        - text: You'll need welding rods if you plan on making stuff.
        - text: They can be found in the same places as a welding mask!
        - text: Keep on stripping cars and you'll have plenty of materials in no time.
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
      - key: SMR_Welding-E2
        itemDisplayName: "VHS: Scrap Metal Maniac E2"
        title: Welding
        subtitle: "Episode 2: Metal Sheet"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: We're going to be working with Metal Sheet today.
          codes:
          - MTL+1
          - BOR-1
        - text: Really versatile stuff we've got here.
        - text: You can use it to make shelves, crates, lockers and more!
        - text: Sturdy storage space that looks great. Or you can use it to barricade.
        - text: Stronger than your old plank and nail barricades, these will last!
          codes:
          - MTL+1
          - BOR-1
        - text: Metal Sheet is bulky and heavy so you'll have to plan out gathering it.
        - text: Nothing worse than carrying 50lbs of Metal Sheet with pesky neighbors around.
        - text: You won't be able to easily run away with that much metal in your possession.
        - text: I gather mine on the road and shove it right into the bed of my truck.
          codes:
          - MTL+1
          - BOR-1
        - text: Easy transport, easy getaway in a sticky situation with pesky neighbors.
        - text: Don't forget your Torch and Mask. Mine are always nearby in the truck.
        - text: That way I can bring home metal on every supply run out in the world.
        - text: But I'm a Scrap Metal Maniac and always on the lookout for good metal.
          codes:
          - MTL+1
          - BOR-1
        - text: I don't expect you all to be as crazy about metal as I am.
        - text: It definitely helps to bring home as much scrap metal as you can.
        - text: Try and be a Scrap Metal Maniac like me! You'll be swimming in metal.
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
      - key: SMR_Welding-E3
        itemDisplayName: "VHS: Scrap Metal Maniac E3"
        title: Welding
        subtitle: "Episode 3: Metal Bars"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: Today we're working with Metal Bars.
          codes:
          - MTL+1
          - BOR-1
        - text: Good for making Metal Window Bars for barricading.
        - text: If you have a copy of Metalwork Magazine 1 on hand
        - text: You can also make Metal Wall Frames with Metal Bars.
        - text: They can also be used as a weapon in a pinch. Not great though.
          codes:
          - MTL+1
          - BOR-1
        - text: But if you have nothing else it will work to fight off pesky neighbors.
        - text: For now lets just worry about barricading with them.
        - text: Take your Metal Bars to a window with your Torch and start barricading!
        - text: It's really easy. It doesn't need to look pretty it just needs to work.
          codes:
          - MTL+1
          - BOR-1
        - text: This will definitely keep out pesky neighbors that wander over.
        - text: See that? Nice and strong. Welded right to the house.
        - text: With practice you'll get better at working with metal.
        - text: You too can become a Scrap Metal Maniac with time!
          codes:
          - MTL+1
          - BOR-1
        - text: You'll never look at copper wire the same way ever again.
        - text: That juicy, juicy copper wire. Just there for the taking.
        - text: Whoops. Sorry. Got a bit distracted there.
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
      - key: SMR_Welding-E4
        itemDisplayName: "VHS: Scrap Metal Maniac E4"
        title: Welding
        subtitle: "Episode 4: Metal Pipes"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: Today we're working with Metal Pipes.
          codes:
          - MTL+1
          - BOR-1
        - text: You'll be using these babies a lot when making stuff.
        - text: Essential in making shelves, crates, lockers, gates and doors.
        - text: You can even use them to make pipe bombs! Jim-Bob's favorite.
        - text: You will want to make sure your supplies are stocked with these.
          codes:
          - MTL+1
          - BOR-1
        - text: Now working with metal is not easy so you will need some skill!
        - text: Practice by dismantling cars and other metal objects for now.
        - text: While you're gaining experience you'll be stocking up on supplies.
        - text: Like with my Metal Sheet runs, I like to use my truck for easy transport.
          codes:
          - MTL+1
          - BOR-1
        - text: Also, keep your eyes open for Metalwork Magazine on your supply runs!
        - text: You will want to learn as much as you can from those magazines.
        - text: For any kind of Metalworking furniture it's a requirement!
        - text: So read up and keep at it on that Metalworking!
          codes:
          - MTL+1
          - BOR-1
        - text: You'll be a Scrap Metal Maniac like me in no time!
        - text: You'll lose sleep over Scrap Metal.
        - text: Everything shiny will catch your eye. Like a damn bird.
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
      - key: SMR_Welding-E5
        itemDisplayName: "VHS: Scrap Metal Maniac E5"
        title: Welding
        subtitle: "Episode 5: Scrap Metal"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: Today we're talking about Scrap Metal.
          codes:
          - MTL+1
          - BOR-1
        - text: The little bits of leftover metal from dismantling things.
        - text: You're going to be using a lot of this stuff while Metalworking.
        - text: You've probably already noticed but it's useful for everything metal.
        - text: Thankfully it's plentiful stuff. You should have a stockpile of Scrap Metal.
          codes:
          - MTL+1
          - BOR-1
        - text: Every Scrap Metal Maniac I know has tons of the stuff. We don't share though.
        - text: So get out there and dismantle things to build up your stockpile!
        - text: No self-respecting Scrap Metal Maniac would dare run out.
        - text: It's okay to get a bit low on stock though. That just means you're making stuff!
          codes:
          - MTL+1
          - BOR-1
        - text: Follow it up with a supply run and you should never run out.
        - text: Scrap every washer and dryer, oven and fridge in your neighborhood!
        - text: Then bring it on home and get to fortifying your house!
        - text: You want lots of barricades, metal doors and walls.
          codes:
          - MTL+1
          - BOR-1
        - text: That way no one is getting to your stash of Scrap Metal!
        - text: Remember, Scrap Metal Maniacs don't share, we scavange!
        - text: So get your own damn Metal. What is this, a Charity?
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
      - key: SMR_Welding-E6
        itemDisplayName: "VHS: Scrap Metal Maniac E6"
        title: Welding
        subtitle: "Episode 6: Propane Tanks"
        lines:
        - text: Scrap Metal Maniac
          icon: music
        - text: My name is Daryl and I'm a Scrap Metal Maniac!
        - text: Today we're talking Propane Tanks!
          codes:
          - MTL+1
          - BOR-1
        - text: Essential for our Metalworking, we use propane for our Torch.
        - text: On your Scrap Metal runs you should be checking BBQ Grills for Propane.
        - text: By now you may be out of Propane. If you're lucky you have a spare tank.
        - text: Start searching your neighborhood if you've run out. Make it a priority on runs.
          codes:
          - MTL+1
          - BOR-1
        - text: The tanks are heavy so once again, use a vehicle like my truck for hauling.
        - text: You don't want to be lugging around explosive Propane Tanks
        - text: if your pesky neighbors run up on you while you're out and about.
        - text: Once you have a supply of Propane go ahead and refill your Torch.
          codes:
          - MTL+1
          - BOR-1
        - text: If you have multiple Torches go ahead and fill them all up.
        - text: Creating metal structures will use up a lot of Propane.
        - text: So like any other Metalworking supplies, stock up as much as you can.
        - text: Each Tank holds 8 Units which is not a lot when you're welding.
          codes:
          - MTL+1
          - BOR-1
        - text: That's only enough for one Metal Crate with a tiny bit to spare!
        - text: My neighborhood has a bit of a shortage, hopefully you have more luck.
        - text: I think there's another Scrap Metal Maniac on my turf.
        - text: Thanks for watching guys! We'll see you next time!
          codes:
          - MTL+1
          - BOR-1
        - text: Scrap Metal Maniac
          icon: music
  farming:
    agriculture:
      vanilla XP: 162.5
      reels:
      - key: SMR_Farming-E1
        itemDisplayName: "VHS: The Homestead E1"
        title: Farming
        subtitle: "Episode 1: Digging"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Nature's bounty is all you need to keep fed in this life.
        - text: Today we're talking digging holes to get our crops ready.
        - text: You can use a standard Shovel, or you can use a Trowel.
        - text: You're going to be digging a lot of holes while farming
          codes:
          - FRM+1
          - BOR-1
        - text: so you'll want to make sure you have an extra Shovel.
        - text: If you're planting large fields because you're feeding lots
        - text: you should get help. Not necessary if you're feeding yourself.
        - text: You'll want to dig in a safe location for your crops.
          codes:
          - FRM+1
          - BOR-1
        - text: Maybe even set up a grow on the roof of a structure.
        - text: Randoms can trample your crops and ruin them all.
        - text: You don't want that, so plan your grow sites well.
        - text: As long as you aren't careless with your digs
          codes:
          - FRM+1
          - BOR-1
        - text: your crops should grow well in your chosen location
        - text: without anyone bothering them. Keeps a lot of pests out too.
        - text: Except birds but you can't do much about that anyway.
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
      - key: SMR_Farming-E2
        itemDisplayName: "VHS: The Homestead E2"
        title: Farming
        subtitle: "Episode 2: Planting"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Today we're going to be talking about planting our seeds
        - text: You'll want adequate spacing between all of your crops.
        - text: This will help prevent disease. We'll talk more about that later.
        - text: For now, rows a few spaces apart will do fine for learning to farm.
          codes:
          - FRM+1
          - BOR-1
        - text: Plant a few crops with the seeds you have and give them some water.
        - text: You always want your crops to be Well Watered so they can keep growing.
        - text: Check your water once per day unless it's raining to keep crops happy!
        - text: If your crops are anything but Well Watered you risk losing the crops.
          codes:
          - FRM+1
          - BOR-1
        - text: During the rainy seasons you can keep Water Catchers out for extra water.
        - text: The rain will provide enough for your crops and reduce your workload.
        - text: Do not forget those Water Catchers in your garden! It can save your crops.
        - text: You also need Sunlight on your crops as much as possible. That's obvious.
          codes:
          - FRM+1
          - BOR-1
        - text: Proper planning for your grow site will prevent future issues so plan ahead.
        - text: It's worth every bit of preparing to keep your crops healthy.
        - text: Now we give these crops a little time to grow and check on them later!
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
      - key: SMR_Farming-E3
        itemDisplayName: "VHS: The Homestead E3"
        title: Farming
        subtitle: "Episode 3: Disease"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Today we're talking Plant Diseases and Pests that attack crops!
        - text: Now you'll need some specific knowledge to deal with some of these.
        - text: So everyone make sure and read The Farming Magazine for some quick cures.
        - text: First up is Mildew which makes your plants grow slower than normal.
          codes:
          - FRM+1
          - BOR-1
        - text: You could end up starving waiting for your crops to come in.
        - text: And it's going to require more water and more work to mature your plants.
        - text: Second up is Insects. These pests will consume all your plant's water.
        - text: You risk your plants dying off if you don't get rid of them quickly.
          codes:
          - FRM+1
          - BOR-1
        - text: Third up is Devil's Water Fungus. Now this bastard is impossible to treat.
        - text: It's way more common in plants that have diseases or pests already!
        - text: If your plants have Fungus you need to dig them up before it spreads.
        - text: All of these issues can spread to nearby plants, guys. Deal with them fast!
          codes:
          - FRM+1
          - BOR-1
        - text: Especially with Fungus. Don't wait unless you are truly desperate for food.
        - text: All of these can devastate your fields and leave you hurting for food supplies.
        - text: Lesser Homesteaders would find their end here. But not us. We fight on.
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
      - key: SMR_Farming-E4
        itemDisplayName: "VHS: The Homestead E4"
        title: Farming
        subtitle: "Episode 4: Growth Rates"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Today we're talking the growth rate for our crops.
        - text: You have 5 stages of growth but you only need to know 2 of them.
        - text: Ready To Harvest or In Bloom, and Seed-bearing crops.
        - text: Ready to Harvest or In Bloom crops will give you more food.
          codes:
          - FRM+1
          - BOR-1
        - text: But you will want to wait if you can until crops produce some seeds.
        - text: You get more seeds out than you put in and you still get some food.
        - text: This will keep your farm churning out food when you need it.
        - text: Now if you're starving and you can't wait you should harvest them.
          codes:
          - FRM+1
          - BOR-1
        - text: Good crops should provide you with enough food to at least survive
        - text: until you can get your hands on some more seeds. Most of the time...
        - text: Subsistence farming isn't an exact science. You just plant and hope.
        - text: You work all you can for good crops but there's no perfect method
          codes:
          - FRM+1
          - BOR-1
        - text: to producing enough food for you and your group. Some eat more than others.
        - text: That's not something easy to predict. Your best bet is to hone your skills.
        - text: You'll get more food as a skilled farmer.
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
      - key: SMR_Farming-E5
        itemDisplayName: "VHS: The Homestead E5"
        title: Farming
        subtitle: "Episode 5: Fertilizer"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Today we're going to talk about Fertilizer and when to use it.
        - text: It's very handy and can save you in a pinch when starving.
        - text: Fertilizer can shave 20 hours off your grow time when used.
        - text: but it's not easy to come by so you want to save it for emergencies.
          codes:
          - FRM+1
          - BOR-1
        - text: Sometimes you can find Fertilizer in sheds and warehouses.
        - text: So it's always a good idea to keep an eye out for it on supply runs.
        - text: If you have mid level Carpentry skills you can make a Composter.
        - text: This will help you in having some Fertilizer around but it's not
          codes:
          - FRM+1
          - BOR-1
        - text: going to be useful enough to give you a lot of Fertilizer.
        - text: The problem is you require Rotten food and lots of time when
        - text: you are making Fertilizer for your crops. 2 weeks regularly.
        - text: If you're Subsistence living then Rotten food may not be something
          codes:
          - FRM+1
          - BOR-1
        - text: you have a lot of because you consume most of your resources.
        - text: It really isn't worth the trouble to grow crops for Fertilizer.
        - text: So save your Fertilizer for special crops or for emergencies.
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
      - key: SMR_Farming-E6
        itemDisplayName: "VHS: The Homestead E6"
        title: Farming
        subtitle: "Episode 6: Large Farms"
        lines:
        - text: The Homestead!
          icon: music
        - text: Howdy folks and welcome to The Homestead!
        - text: Where we learn to grow our own food without relying on others.
          codes:
          - FRM+1
          - BOR-1
        - text: Today we're going to talk about efficient large farms.
        - text: When you have a group to feed efficiency is important.
        - text: Wasted food could be used for Fertilizer but it could also
        - text: mean starving to death as well. Risky gamble you know.
          codes:
          - FRM+1
          - BOR-1
        - text: Large farms require adequate spacing for all crops so
        - text: they don't spread diseases or pests to each other. Or Fungus.
        - text: You may not be able to treat every single crop for diseases.
        - text: Speaking of, Strawberries are a disease magnet in these parts.
          codes:
          - FRM+1
          - BOR-1
        - text: As enjoyable as Strawberries are the work is not worth it.
        - text: Now you'll want to space out your plantings on large farms.
        - text: You may not have the manpower to harvest quickly so a delay
        - text: of a day or two between rows of crops can prevent rot.
          codes:
          - FRM+1
          - BOR-1
        - text: If you leave your crops too long without harvesting they will rot.
        - text: You can lose your whole harvest and end up starving.
        - text: Not a good time, especially when you have a group to feed.
        - text: Well that's all we have for today. See you next time!
          codes:
          - FRM+1
          - BOR-1
        - text: The Homestead!
          icon: music
    animal care:
    butchering:
  physical:
