  survival:
    first aid:
      vanilla XP: 162.5
      reels:
      - key: SMR_FirstAid-E1
        itemDisplayName: "VHS: Damn It Jim-Bob E1"
        title: FirstAid
        subtitle: "Episode 1: Bandages"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: First Aid is a hard skill to get good at and harder to master.
        - text: To really learn you need wounds to treat regularly.
        - text: That's not feasible outside of working a Hospital.
        - text: Your best bet in our case is working on your friends.
          codes:
          - DOC+1
          - BOR-1
        - text: Lets talk simple Bandages first and foremost here.
        - text: For a simple cut you want a sterlized bandage.
        - text: A regular bandage or rag will do the trick for a while.
        - text: Those bandages get dirty fast and you want to change them.
          codes:
          - DOC+1
          - BOR-1
        - text: If you don't you could get an infection and die from it.
        - text: Even if you don't die, the fever will exhaust you a lot.
        - text: Keep a lot of Bandages handy especially with friends around.
        - text: Sterilized is best to prevent infection but not always doable.
          codes:
          - DOC+1
          - BOR-1
        - text: Work with what you have and make the best of it out there.
        - text: Practice on your friends and yourself whenever the chance arises.
        - text: You'll get some good experience doing that and in time learn more.
        - text: That's all for today! Tomorrow we're talking Disinfecting!
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
      - key: SMR_FirstAid-E2
        itemDisplayName: "VHS: Damn It Jim-Bob E2"
        title: FirstAid
        subtitle: "Episode 2: Disinfecting"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: When you've got open wounds you always have a chance of infection.
        - text: You'll want to keep a Bottle of Disinfectant around for wounds.
        - text: Or a bottle of Bourbon if you're in a pinch and low on supplies.
        - text: You can boil Bandages to Sterilize them but that takes time.
          codes:
          - DOC+1
          - BOR-1
        - text: You may not always have time when treating wounds.
        - text: As always do the best with what you have on hand.
        - text: You do want to make sure you Sterilize as much as possible though.
        - text: Using your downtime to get supplies ready is important here.
          codes:
          - DOC+1
          - BOR-1
        - text: That way you always have Sterilized Bandages ready to go.
        - text: And you don't have to deal with someone bleeding on your floor lots.
        - text: Jim-Bob has just completely ruined the floor of my garage.
        - text: I've never seen a man with all his fingers but so many chunks missing.
          codes:
          - DOC+1
          - BOR-1
        - text: Now someone who might come to you with a missing finger is Daryl.
        - text: That scrap metal is sharp and he's not very careful about it.
        - text: If you're lucky you'll have lots of practice with friends.
        - text: And if you're skilled they won't die. Tomorrow lets talk Lacerations.
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
      - key: SMR_FirstAid-E3
        itemDisplayName: "VHS: Damn It Jim-Bob E3"
        title: FirstAid
        subtitle: "Episode 3: Lacerations"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: Today we're going to talk about deep cuts, or Lacerations.
        - text: You'll definitely want to Suture these wounds shut.
        - text: You want a Suture Needle for this job if you can get it.
        - text: But a regular needle and thread can do the trick.
          codes:
          - DOC+1
          - BOR-1
        - text: It will just be more painful and probably less sterile.
        - text: But we make do with what we have on hand around here.
        - text: You'll want some pain meds around if you're Suturing wounds.
        - text: Lacerations hurt enough by themselves without stitching.
          codes:
          - DOC+1
          - BOR-1
        - text: You can also find Suture Needle Holders sometimes too.
        - text: Those will make Suturing Lacerations quicker and less painful.
        - text: Always make sure you're Disinfecting these wounds.
        - text: And with a Suture you don't want to use a Bandage.
          codes:
          - DOC+1
          - BOR-1
        - text: Let the wound air out to heal faster with Sutures.
        - text: Your friends will thank you for it, trust me.
        - text: The increase in healing speed makes a difference.
        - text: Tomorrow we're going to talk about Pills!
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
      - key: SMR_FirstAid-E4
        itemDisplayName: "VHS: Damn It Jim-Bob E4"
        title: FirstAid
        subtitle: "Episode 4: Pills"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: Today we're talking Pills of all kinds for medical use.
        - text: There are a variety of useful pills out there we need.
        - text: You have Antibiotics for treating wound infections.
        - text: There's Antidepressants to ease Unhappiness.
          codes:
          - DOC+1
          - BOR-1
        - text: Beta Blockers can help you reduce Panic.
        - text: Sleeping Tablets if you need rest badly.
        - text: You can use these to sleep while in pain!
        - text: Vitamins if you need to stay awake longer.
          codes:
          - DOC+1
          - BOR-1
        - text: And good old Painkillers to numb your pain.
        - text: All of these are useful to you in treating people.
        - text: It's not just physical wounds you will deal with.
        - text: Stresses of all kinds will get you down bad.
          codes:
          - DOC+1
          - BOR-1
        - text: They can mess with your health quickly.
        - text: So we keep a big stockpile of Pills around here.
        - text: You never know when you will need some.
        - text: Tomorrow we're going to talk about Bites!
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
      - key: SMR_FirstAid-E5
        itemDisplayName: "VHS: Damn It Jim-Bob E5"
        title: FirstAid
        subtitle: "Episode 5: Bites"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: Today we're talking Bites. They're really nasty wounds.
        - text: The human mouth is just teeming with harmful bacteria.
        - text: Our inner defenses do a really good job of protecting us.
        - text: But that doesn't do much good when it comes to bites.
          codes:
          - DOC+1
          - BOR-1
        - text: It's a direct transfer from a bacteria breeding grounds.
        - text: A direct transfer right into an open wound of all things.
        - text: You could catch all kinds of things from being bitten.
        - text: If you get bitten you have a high chance getting a bad infection.
          codes:
          - DOC+1
          - BOR-1
        - text: So avoid situations where someone rabid like Jim-Bob tries to bite you.
        - text: Well what happens if you or a friend gets bit out in the wild?
        - text: You could come down with a fever that exhausts your whole body.
        - text: You'll be hot and queasy all the time and won't heal properly.
          codes:
          - DOC+1
          - BOR-1
        - text: Your infection could just get worse and worse. Could be fatal.
        - text: Sometimes it takes weeks to die from an infection.
        - text: Sometimes it's a whole lot quicker than that.
        - text: Next time we're going to talk about Poultices.
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
      - key: SMR_FirstAid-E6
        itemDisplayName: "VHS: Damn It Jim-Bob E6"
        title: FirstAid
        subtitle: "Episode 6: Herbal Meds"
        lines:
        - text: Damn It Jim-Bob!
          icon: music
        - text: Hi I'm Nancy the resident Medic here in the area.
        - text: I patch up the good folks around here when they get hurt.
          codes:
          - DOC+1
          - BOR-1
        - text: Today we're talking Herbal Poultices.
        - text: If you've read The Herbalist then you know them.
        - text: Comfrey, Plantain and Wild Garlic Poultices.
        - text: These three need to be crushed in a Mortar and Pestle.
          codes:
          - DOC+1
          - BOR-1
        - text: Comfrey aids in healing broken bones. Very helpful.
        - text: Plantain helps with faster wound recovery.
        - text: Wild Garlic can fight against wound infections!
        - text: There are other herbs like Black Sage for pain relief.
          codes:
          - DOC+1
          - BOR-1
        - text: Common Mallow helps with Cold and Flu symptoms.
        - text: Lemon Grass can help with food poisoning. Keep it on hand.
        - text: Ginseng can give bursts of energy and keep you chugging along.
        - text: Now all of these herbs are found by Foraging only.
          codes:
          - DOC+1
          - BOR-1
        - text: And you have to read The Herbalist to know what to look for.
        - text: It helps to have friends who specialize in Foraging.
        - text: Willie is always out and about gathering those damn Mushrooms.
        - text: That's all for today! We'll see you all next time!
          codes:
          - DOC+1
          - BOR-1
        - text: Damn It Jim-Bob!
          icon: music
    fishing:
      vanilla XP: 125
      reels:
      - key: SMR_Fishing-E1
        itemDisplayName: "VHS: Fat Bass Fishing E1"
        title: Fishing
        subtitle: "Episode 1: Fishing Rods"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're talking Fishing Rods and where to get them.
          codes:
          - FIS+1
          - BOR-1
        - text: Now you can find Fishing Rods a few different places.
        - text: In garden sheds, shacks in the woods and hardware stores.
        - text: They're not incredibly common so keep an eye out for one.
        - text: You can always craft a Makeshift Fishing Rod if you have a copy
          codes:
          - FIS+1
          - BOR-1
        - text: of Angler USA Magazine Volume 1. That makes things a bit easier.
        - text: Not a guarantee you'll find that issue on your runs though.
        - text: Keep looking out there for fishing supplies so you can fish
        - text: without any issues in the future. Because your line will break.
          codes:
          - FIS+1
          - BOR-1
        - text: You'll need some supplies to fix up your rod in that case.
        - text: You can use a Paperclip or Nail, and Fishing Line or Twine.
        - text: That will get your rod back in to working order again.
        - text: In the beginning your line may break a lot. You just have to deal.
          codes:
          - FIS+1
          - BOR-1
        - text: So be sure to get as much Twine and Fishing Line as you can find.
        - text: It's worth it's weight in gold and anyone would find it useful.
        - text: Keep your stash of repair materials stashed safely.
        - text: Hopefully in no time flat you should be a fishing pro!
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
      - key: SMR_Fishing-E2
        itemDisplayName: "VHS: Fat Bass Fishing E2"
        title: Fishing
        subtitle: "Episode 2: Bait"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're talking about different kinds of fishing bait.
          codes:
          - FIS+1
          - BOR-1
        - text: There are 3 types of bait to use including Insects, Tackle and Small Fish.
        - text: Worms are the most common bait and you can get them by digging a lot.
        - text: When using worms even if you don't catch something you will lose your worm.
        - text: There are other insects that work as bait that you can find out there.
          codes:
          - FIS+1
          - BOR-1
        - text: Tackle usually won't be consumed while fishing so it's good to have some.
        - text: It will catch you more fish but should be saved up in your stash.
        - text: wThose are good for Mid and High Level Fishing skills to be efficient.
        - text: Stick to fishing with worms. You should find plenty by farming actually.
          codes:
          - FIS+1
          - BOR-1
        - text: The last kind of bait are Little Bait Fish which you get fishing.
        - text: This bait is only for catching Pike and has a high chance of getting
        - text: you junk in return for your efforts. It's consumed when used for fishing.
        - text: So there you have it, those are your bait options while fishing.
          codes:
          - FIS+1
          - BOR-1
        - text: If you strike it rich on Fishing Tackle you'll likely have plenty of fish.
        - text: But good old worm fishing is always an option to consider.
        - text: Especially during hard times. Sometimes the basics are what we need.
        - text: And when you're Subsistence living every piece of scrap counts.
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
      - key: SMR_Fishing-E3
        itemDisplayName: "VHS: Fat Bass Fishing E3"
        title: Fishing
        subtitle: "Episode 3: Nets"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're talking about Fishing Net Traps.
          codes:
          - FIS+1
          - BOR-1
        - text: With these Nets you're going to catch Little Bait Fish.
        - text: If you have the supplies to make a few of these do it.
        - text: Little Bait Fish can catch you a Pike if you're skilled.
        - text: Luck always plays a big part in fishing but easy bait helps.
          codes:
          - FIS+1
          - BOR-1
        - text: Check on your traps every hour for a catch to be efficient.
        - text: If you leave Nets for more than 15 hours they will break.
        - text: You don't want to go wasting good Twine on these if all
        - text: you do is ignore them and let them break in the water.
          codes:
          - FIS+1
          - BOR-1
        - text: So be sure to grab your traps and take them home.
        - text: That way you can keep efficiently getting some bait.
        - text: Now with these Traps you don't have to leave the area.
        - text: You can hang out and do some fishing with your rod too.
          codes:
          - FIS+1
          - BOR-1
        - text: Maximizing your time and effort will keep you well fed.
        - text: You want to practice these things when you have a group
        - text: depending on you to keep them fed. Every bit helps.
        - text: So get out there and get to fishing. Become a pro!
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
      - key: SMR_Fishing-E4
        itemDisplayName: "VHS: Fat Bass Fishing E4"
        title: Fishing
        subtitle: "Episode 4: Spear Fishing"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're going to talk about Spear Fishing.
          codes:
          - FIS+1
          - BOR-1
        - text: It's not very efficient but in a pinch it can save you.
        - text: Crafting up a regular Spear is what you need for this.
        - text: It's about as sturdy as a Makeshift Fishing Rod with Twine
        - text: so it's a decent alternative on a very strict budget.
          codes:
          - FIS+1
          - BOR-1
        - text: Since it's not efficient you'll get lower returns.
        - text: Even if you're a master fisherman this will net you
        - text: only the bare minimum of fish to cook and eat.
        - text: This is just an emergency tactic if you're starving.
          codes:
          - FIS+1
          - BOR-1
        - text: As a master myself I don't use this technique much.
        - text: It was more something I did out of frustration
        - text: early in my fishing journey so I didn't starve.
        - text: The luck and efficiency that comes from Rod and Tackle
          codes:
          - FIS+1
          - BOR-1
        - text: just can't be beat if we're talking food to eat here.
        - text: Worms are still going to be your best bet though.
        - text: Hopefully today you learned an important skill.
        - text: One that may save you in a pinch out there.
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
      - key: SMR_Fishing-E5
        itemDisplayName: "VHS: Fat Bass Fishing E5"
        title: Fishing
        subtitle: "Episode 5: Seasonal Fishing"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're going to talk about Seasonal Fishing.
          codes:
          - FIS+1
          - BOR-1
        - text: Mostly we're just going to talk about how winter sucks.
        - text: Between November and February you have decreased chances
        - text: of catching a fish. Especially with Spear Fishing.
        - text: You need some skill to overcome this decrease.
          codes:
          - FIS+1
          - BOR-1
        - text: So it's smart to spend Spring and Summer fishing!
        - text: By the time Winter rolls around you'll have some skill.
        - text: You won't be out there on the shore starving.
        - text: You'll be able to kick back and relax while you fish.
          codes:
          - FIS+1
          - BOR-1
        - text: You'll be bringing home enough fish to feed your group.
        - text: It all comes with time and patience when it comes to fishing.
        - text: So get your gear early and hit the shore early.
        - text: You'll be well on your way to being a fishing pro!
          codes:
          - FIS+1
          - BOR-1
        - text: So remember, Winter really sucks for Fishing.
        - text: You CAN catch fish, but you want to be prepared.
        - text: And that comes with not waiting until winter
        - text: to start your fishing journey and train up.
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
      - key: SMR_Fishing-E6
        itemDisplayName: "VHS: Fat Bass Fishing E6"
        title: Fishing
        subtitle: "Episode 6: Overfishing"
        lines:
        - text: Fat Bass Fishing!
          icon: music
        - text: Welcome to Fat Bass Fishing! I'm your host Rodney.
        - text: Today we're talking about Overfishing, and Abundance levels.
          codes:
          - FIS+1
          - BOR-1
        - text: While you're out fishing you may have noticed the Abundance
        - text: of the fish in the area you're fishing in. It matters.
        - text: Now the lower the Abundance the less likely you will get fish.
        - text: And once that Abundance is gone you won't catch fish in that spot.
          codes:
          - FIS+1
          - BOR-1
        - text: You have to let Nature heal and let the fish multiply some.
        - text: Even Overfished spots will heal eventually. May wait a while though.
        - text: So your best chance against Overfishing is to plan ahead.
        - text: You can't always know how much your group is going to need
          codes:
          - FIS+1
          - BOR-1
        - text: but you can take meaningful effort not to exhaust the fish.
        - text: Don't continually fish the same spots. Travel a while.
        - text: If you're stuck with a small body of water well buddy I hope
        - text: you know how to farm and trap as well. You're gonna Overfish it.
          codes:
          - FIS+1
          - BOR-1
        - text: If you're desperate and starving don't save the Abundance.
        - text: It would be better to Overfish a spot temporarily than to starve.
        - text: Hopefully now you know all you need to know about Fishing.
        - text: Keep working at it and you'll be a professional in no time.
          codes:
          - FIS+1
          - BOR-1
        - text: Fat Bass Fishing!
          icon: music
