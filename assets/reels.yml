# Ground truth for the vanilla XP info here: https://williamvenner.github.io/pz-rm-explorer/
skills:
  combat - firearms:
    aiming:
      vanilla XP: 87.5
    reloading:
      vanilla XP: 87.5
  combat - melee:
    axe:
    long blade:
    long blunt:
      vanilla XP: 12.5
    maintenance:
    short blade:
    short blunt:
    spear:
  crafting:
    blacksmithing:
    carpentry:
      vanilla XP: 625
      reels:
      - key: SMR_Carpentry-E1
        itemDisplayName: "VHS: This Old Trailer E1"
        title: Carpentry
        subtitle: "Episode 1: Chairs"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be dismantling chairs.
          codes:
          - CRP+1
          - BOR-1
        - text: Just go and find any old chair. Don't have one?
        - text: Your neighbor's chair will do just fine.
        - text: The only tools you will need are a hammer and saw.
        - text: Go ahead and saw off the legs and backrest
          codes:
          - CRP+1
          - BOR-1
        - text: Take any good bits and set them to the side.
        - text: Now go ahead and smash it a bit with your hammer.
        - text: Really get in there and smash that seat up.
        - text: Today we're just after firewood. The legs are good.
          codes:
          - CRP+1
          - BOR-1
        - text: So is the backrest. The seat is too big.
        - text: Now once the seat is good and smashed you're done.
        - text: You should have a small bit of wood for your own use.
        - text: As long as you're somewhat skilled anyway.
          codes:
          - CRP+1
          - BOR-1
        - text: The smashed bits make good kindling though!
        - text: Well that's all for today folks!
        - text: Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E2
        itemDisplayName: "VHS: This Old Trailer E2"
        title: Carpentry
        subtitle: "Episode 2: Doors"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking dismantling doors.
          codes:
          - CRP+1
          - BOR-1
        - text: Our tools for this job are a hammer and screwdriver.
        - text: Now these babies are great for getting some experience.
        - text: There are lots of them in your typical house.
        - text: Like your nextdoor neighbor's house for instance.
          codes:
          - CRP+1
          - BOR-1
        - text: You may have to smash a window to get in the house.
        - text: "*glass breaking* But that's okay! Don't get cut going in!"
        - text: Be sure to use a tool and smash the rest of the glass out.
        - text: Now let's go in and open some doors up huh fellas?
          codes:
          - CRP+1
          - BOR-1
        - text: Open up every door in the house, we're going to dismantle them.
        - text: Take your screwdriver and undo the hinges on the door.
        - text: Then go ahead and smash it with your hammer a bunch.
        - text: Now if you're skilled you should have some planks you can use.
          codes:
          - CRP+1
          - BOR-1
        - text: Now that we've gotten rid of some pesky doors,
        - text: It's time to drink all your neighbors beer! Hahaha.
        - text: That's all for today. Remember folks, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E3
        itemDisplayName: "VHS: This Old Trailer E3"
        title: Carpentry
        subtitle: "Episode 3: Planks"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be talking about planks.
          codes:
          - CRP+1
          - BOR-1
        - text: Good for barricading windows and doorways.
        - text: Good for making furniture to store your things in.
        - text: In a pinch you can even use a plank as a weapon!
        - text: They're good at knocking people down in a fight.
          codes:
          - CRP+1
          - BOR-1
        - text: I like to use planks for smashing my neighbor's windows.
        - text: Then I get lots more planks to use for whatever I want!
        - text: Careful not to carry too many at once though.
        - text: They are pretty heavy and you could hurt yourself!
          codes:
          - CRP+1
          - BOR-1
        - text: Be quiet and make multiple trips to avoid problems.
        - text: Or you can always bring a buddy with you to help.
        - text: Now we just need to figure out where to put all these planks.
        - text: But we will talk about that more next episode.
          codes:
          - CRP+1
          - BOR-1
        - text: It's all about storage for planks and more!
        - text: Well that's it for today's show. Hope it was informative.
        - text: Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E4
        itemDisplayName: "VHS: This Old Trailer E4"
        title: Carpentry
        subtitle: "Episode 4: Storage"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking about storage!
          codes:
          - CRP+1
          - BOR-1
        - text: You should have enough skill by now to make something.
        - text: Crates are a good starting point for your storage needs.
        - text: You'll need a hammer, 3 planks and 3 nails for one.
        - text: Go ahead and build it any old place. Mine's in the garage.
          codes:
          - CRP+1
          - BOR-1
        - text: You can also make a small bookcase with 3 planks and 3 nails.
        - text: I keep my collection of HottieZ magazines in mine.
        - text: Need more storage in your kitchen or garage?
        - text: Add some shelves for just 2 plank and 2 nails.
          codes:
          - CRP+1
          - BOR-1
        - text: A double shelf is 2 planks and 4 nails.
        - text: Plenty of storage options for all your needs.
        - text: Go ahead and think up some places in your old trailer,
        - text: and add some storage space wheverever you need it.
          codes:
          - CRP+1
          - BOR-1
        - text: You can never have enough storage for all your planks.
        - text: Or whatever else you're collecting out there.
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E5
        itemDisplayName: "VHS: This Old Trailer E5"
        title: Carpentry
        subtitle: "Episode 5: Barricading"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're talking about barricading with planks!
          codes:
          - CRP+1
          - BOR-1
        - text: Have you got lots of planks and nothing to use them on?
        - text: Barricade your windows and any doorways you don't use!
        - text: It's very handy at keeping the cops out of your old trailer.
        - text: Or any pesky neighbors poking around asking about their stuff.
          codes:
          - CRP+1
          - BOR-1
        - text: You'll need a hammer and a bunch of nails for this job.
        - text: And of course lots of planks. You should have plenty by now.
        - text: If not go pay one of your neighbors a visit and get some.
        - text: You can fit 4 planks over each window. You need 2 nails each.
          codes:
          - CRP+1
          - BOR-1
        - text: Go ahead and barricade up all your windows in your trailer.
        - text: If you have a backdoor go ahead and barricade that too.
        - text: We don't want anyone sneaking in and attacking from behind.
        - text: All barricaded up? Good! Now we can relax and drink some beer.
          codes:
          - CRP+1
          - BOR-1
        - text: My neighbor generously donated this 18 pack here.
        - text: Nothing in this world better than free beer! Hahaha.
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
      - key: SMR_Carpentry-E6
        itemDisplayName: "VHS: This Old Trailer E6"
        title: Carpentry
        subtitle: "Episode 6: Nail Bat"
        lines:
        - text: This Old Trailer
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Trailer!
        - text: Today we're going to be making something special, a nail bat.
          codes:
          - CRP+1
          - BOR-1
        - text: This weapon will serve you well in this crazy world.
        - text: Very handy and easy to make. Just a bat with nails in it!
        - text: All you need is your hammer, 5 nails and a baseball bat.
        - text: Now if you don't have a bat, sporting good stores are great places!
          codes:
          - CRP+1
          - BOR-1
        - text: I'm sure you have one nearby you can borrow a bat from.
        - text: Go ahead and hammer the nails in the top of the bat like so.
        - text: Make sure they're nice and straight for extra stabby power!
        - text: Now give it a few swings and see how it feels. Good right?
          codes:
          - CRP+1
          - BOR-1
        - text: Careful not to hit yourself. That will leave a mark. Haha.
        - text: Now you're armed up if any pesky neighbors come around.
        - text: Nobody is going to steal your stash of planks now!
        - text: All of us at This Old Trailer hope you picked up some skills,
          codes:
          - CRP+1
          - BOR-1
        - text: watching us smash up our neighbor's house for planks.
        - text: Keep an eye out for our next show This Old Generator!
        - text: That's all for today. Remember, always play with your wood!
        - text: This is Jim-Bob signing off!
          codes:
          - CRP+1
          - BOR-1
        - text: This Old Trailer
          icon: music
    carving:
      reels: 
      - key: SMR_Carving-E1
        itemDisplayName: "Woodcarving with Rick Bütz E1"
        title: Carving
        subtitle: "Episode 1: The Fundamentals of Chip Carving"
        lines:
        - text: Woodcarving with Rick Bütz
          icon: music
        - text: Hello and welcome to Woodcarving. I'm Rick Bütz, 
          codes:
          - CRV+1
          - BOR-1
        - text: Today we explore the ancient art of chip carving.
        - text: We carve small triangles to make beautiful geometric patterns.
        - text: Use a short chip carving knife and a smooth piece of basswood.
        - text: Basswood is perfect for its straight grain and soft texture.
          codes:
          - CRV+1
          - BOR-1
        - text: Draw a grid of squares on your board with a pencil and ruler.
        - text: Inside each square, draw a triangle meeting at the center.
        - text: Hold your knife at sixty degrees with your thumb anchored.
        - text: Plunge your knife straight down from one corner to the center.
          codes:
          - CRV+1
          - BOR-1
        - text: Repeat this deep cut on the other two sides of the triangle.
        - text: Slice horizontally from the outer edge to meet your deep cuts.
        - text: A crisp wooden chip should pop out, leaving a clean recess.
        - text: If it sticks, do not pry. Re-insert and deepen the cuts.
          codes:
          - CRV+1
          - BOR-1
        - text: Carve slowly and turn the board away from your holding hand.
        - text: With patience, these cuts will form a beautiful star pattern.
        - text: That is all our time today. Keep your knives sharp, be safe.
          codes:
          - CRV+1
          - BOR-1
        - text: Woodcarving with Rick Bütz
          icon: music
      - key: SMR_Carving-E2
        itemDisplayName: "Woodcarving with Rick Bütz E2"
        title: Carving
        subtitle: "Episode 2: Traditional Folk Carvings"
        lines:
        - text: Woodcarving with Rick Bütz
          icon: music
        - text: Welcome back to Woodcarving. I am Rick Bütz.
        - text: Today, we are whittling traditional folk figures.
          codes:
          - CRV+1
          - BOR-1
        - text: We will carve a simple flat-plane wooden fisherman.
        - text: Grab a block of soft white pine or clear basswood.
        - text: Use your carving knife to block out the head first.
          codes:
          - CRV+1
          - BOR-1
        - text: Make clean, slicing cuts to form the shoulders.
        - text: Flat-plane carving relies on simple, bold angles.
        - text: Avoid sanding your work. Keep the knife marks visible.
          codes:
          - CRV+1
          - BOR-1
        - text: Now, let us define the brim of his classic hat.
        - text: Slice downward to make his heavy winter coat.
        - text: Keep your thumb anchored for perfect blade control.
          codes:
          - CRV+1
          - BOR-1
        - text: Shave a tiny triangle of wood for the nose.
        - text: Our little fisherman is looking wonderful already.
        - text: Next week, we will tackle relief carving projects.
          codes:
          - CRV+1
          - BOR-1
        - text: Keep your knives sharp, be safe, and happy carving.
        - text: Woodcarving with Rick Bütz
          icon: music
      - key: SMR_Carving-E3
        itemDisplayName: "Woodcarving with Rick Bütz E3"
        title: Carving
        subtitle: "Episode 3: Making A Hammer Handle"
        lines:
        - text: Woodcarving with Rick Bütz!
          icon: music
        - text: Welcome back. Today we make a sturdy wooden hammer handle.
        - text: We will use a strong piece of straight-grained hickory.
          codes:
          - CRV+1
          - BOR-1
        - text: Hickory is highly durable and absorbs heavy impacts well.
        - text: First, secure the raw wood blank tightly in your vice.
        - text: Use a sharp drawknife to shave down the rough square edges.
          codes:
          - CRV+1
          - BOR-1
        - text: Pull the knife toward you with even, steady pressure.
        - text: Keep checking your progress to ensure a comfortable grip.
        - text: Shape the lower portion to fit the palm of your hand.
          codes:
          - CRV+1
          - BOR-1
        - text: Now, taper the top end to fit inside the hammer eye.
        - text: Use a small wood rasp to refine the neck of the handle.
        - text: Cut a thin slot down the center of the top tapered end.
          codes:
          - CRV+1
          - BOR-1
        - text: This slot will hold our wooden wedge to lock it in place.
        - text: Use some fine sandpaper to smooth out any rough spots left.
        - text: Tap the handle firmly into the metal head of the hammer.
          codes:
          - CRV+1
          - BOR-1
        - text: Drive the wedge into the slot to secure the head tightly.
        - text: Join us next time. Keep your tools sharp and carve safely.
        - text: Woodcarving with Rick Bütz!
          icon: music

      - key: SMR_Carving-E4
        itemDisplayName: "Woodcarving with Rick Bütz E4"
        title: Carving
        subtitle: "Episode 4: Whittling A Wooden Goblet"
        lines:
        - text: Woodcarving with Rick Bütz!
          icon: music
        - text: Welcome back to Woodcarving. I am Rick Bütz.
        - text: Today we are whittling a classic wooden goblet.
          codes:
          - CRV+1
          - BOR-1
        - text: We will carve this from a block of soft basswood.
        - text: This project is excellent for practicing tool control.
        - text: Draw the goblet profile on all sides of your wood.
          codes:
          - CRV+1
          - BOR-1
        - text: Use a sharp detail knife to outline the outer cup.
        - text: Carefully hollow out the bowl using a spoon gouge.
        - text: Take thin shavings and work slowly from the center.
          codes:
          - CRV+1
          - BOR-1
        - text: Always keep your non-carving hand behind the blade.
        - text: Next, slice downward to rough out the slender stem.
        - text: Relieve the wood gradually to prevent any splitting.
          codes:
          - CRV+1
          - BOR-1
        - text: Shape the base with sweeping cuts toward the edge.
        - text: Use fine sandpaper to smooth out the final details.
        - text: Our beautiful wooden goblet is complete and ready.
          codes:
          - CRV+1
          - BOR-1
        - text: Next week, we will carve a rustic wooden whistle.
        - text: Keep your knives sharp, be safe, and happy carving.
        - text: Woodcarving with Rick Bütz!
          icon: music
      - key: SMR_Carving-E5
        itemDisplayName: "Woodcarving with Rick Bütz E5"
        title: Carving
        subtitle: "Episode 5: Making Cutlery Crash Course"
        lines:
        - text: Woodcarving with Rick Bütz!
          icon: music
        - text: Welcome back to Woodcarving. I am Rick Bütz.
        - text: Today we have a crash course in making cutlery.
          codes:
          - CRV+1
          - BOR-1
        - text: We will carve a simple wooden spoon and a fork.
        - text: Select a straight piece of unseasoned cherry wood.
        - text: Draw the template of the spoon on your wood block.
          codes:
          - CRV+1
          - BOR-1
        - text: Use a small hatchet to rough out the basic shape.
        - text: Keep your cuts light and work slowly with the grain.
        - text: Use a curved spoon gouge to hollow out the bowl.
          codes:
          - CRV+1
          - BOR-1
        - text: Take very thin shavings to keep the surface smooth.
        - text: Now we will carve the tines of our wooden fork.
        - text: Use a small detail saw to cut between the tines.
          codes:
          - CRV+1
          - BOR-1
        - text: Carefully clean up the narrow slots with a knife.
        - text: Round all the sharp edges to make them comfortable.
        - text: Give both pieces a quick rub with fine sandpaper.
          codes:
          - CRV+1
          - BOR-1
        - text: Our beautiful handmade wooden set is now complete.
        - text: Join us next week. Keep your knives sharp and safe.
        - text: Woodcarving with Rick Bütz!
          icon: music
      - key: SMR_Carving-E6
        itemDisplayName: "Woodcarving with Rick Bütz E6"
        title: Carving
        subtitle: "Episode 6: Out Of Weapons? Carve a shortbat!"
        lines:
        - text: Woodcarving with Rick Bütz!
          icon: music
        - text: Welcome back to the woodcarving shop.
        - text: Today we are in a bit of a tight spot.
          codes:
          - CRV+1
          - BOR-1
        - text: Those groaning neighbors are at the door.
        - text: And your trusty spiked bat just shattered.
        - text: Do not panic if you are out of weapons.
          codes:
          - CRV+1
          - BOR-1
        - text: We can carve a sturdy shortbat right now.
        - text: Start with a thick piece of seasoned wood.
        - text: A sturdy hickory or ash branch is best.
          codes:
          - CRV+1
          - BOR-1
        - text: Take your pocket knife and peel the bark.
        - text: Smooth down the grip so it fits your hand.
        - text: Whittle the barrel to keep it balanced.
          codes:
          - CRV+1
          - BOR-1
        - text: A few quick strokes will shape the handle.
        - text: This simple bat will save your life today.
        - text: One good swing can knock a zombie down.
          codes:
          - CRV+1
          - BOR-1
        - text: Keep your tools sharp and your eyes open.
        - text: Join us next time and happy carving.
        - text: Woodcarving with Rick Bütz!
          icon: music
    cooking:
      vanilla XP: 487.5
      reels:
      - key: SMR_Cooking-E1
        itemDisplayName: "VHS: Cooking With Gas E1"
        title: Cooking
        subtitle: "Episode 1: BBQ Is Best!"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: I love a good grilled meat, it's the best.
        - text: You can grill so many different kinds of food it's insane!
        - text: Did you know you can grill a Pot of Soup?
        - text: Grilled Pancakes?! Yes sir! With butter and syrup!
          codes:
          - COO+1
          - BOR-1
        - text: You can even grill up some tea on a cold night.
        - text: I even use my grill to cook my bread and pies.
        - text: Just about anything is possible when you are
        - text: Cooking With Gas! Let your imagination soar!
          codes:
          - COO+1
          - BOR-1
        - text: Lets get a Propane Tank hooked up to the grill...
        - text: Hey Roger have you seen where my Propane Tank went?
        - text: "Roger Offscreen: Nope haven't seen it. Sorry dude."
        - text: Well shoot. Good thing we have a few spares around.
          codes:
          - COO+1
          - BOR-1
        - text: When you're Cooking With Gas you'll want to keep spares.
        - text: Here at The Homestead we have lots of gas. Especially Rodney.
        - text: "Rodney Offscreen: Shut up dude I don't fart that much."
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E2
        itemDisplayName: "VHS: Cooking With Gas E2"
        title: Cooking
        subtitle: "Episode 2: Soup"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're going to grill up a bit Pot of Soup.
        - text: Now because we live on The Homestead we have lots of raw
        - text: ingredients for our soup. Roger is a Farmer. He grows lots.
        - text: So we have broccoli, cabbage, carrot, potato, tomato and radish.
          codes:
          - COO+1
          - BOR-1
        - text: You'll only have room for 6 ingredients and each one is important.
        - text: Your ingredients will make your Pot of Soup better for you,
        - text: So you want to have a healthy variety of ingredients.
        - text: You can also throw in some meat, or if you're low on that
          codes:
          - COO+1
          - BOR-1
        - text: you can use some Dry Ramen, or Canned Vegetables.
        - text: If we get our hands on them we like to use Bell Peppers and Cheese.
        - text: Your Pot of Soup will take 50 minutes to cook. Burns in 100 minutes.
        - text: So keep an eye on your grill! You don't want to waste any food!
          codes:
          - COO+1
          - BOR-1
        - text: Here on The Homestead we use everything we get our hands on.
        - text: Survivalist Skills work well together in keeping your group fed.
        - text: You'll have to do all you can to keep fed as well.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E3
        itemDisplayName: "VHS: Cooking With Gas E3"
        title: Cooking
        subtitle: "Episode 3: Stew"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're cooking up a pot of Fish and Cabbage Stew!
        - text: Rodney came back with a bunch of fish so we have meat!
        - text: Thanks to Roger we have good cabbages this season.
        - text: All we need is a study Cooking Pot, same as with making soup.
          codes:
          - COO+1
          - BOR-1
        - text: You'll need 1 and a half Fish Fillet and same for cabbage.
        - text: Throw that in a pot of water and let it cook for 70 minutes.
        - text: This meal is great when you're Hungry and it can help with Thirst.
        - text: With this Stew you will have enough to share with a friend.
          codes:
          - COO+1
          - BOR-1
        - text: Which is good because your friends will have interesting ingredients!
        - text: Think up some good Stew combinations! You can use a lot of stuff.
        - text: Bacon, Steak, Meat Patty, Beef Jerky. You can even get a bit more
        - text: out of ingredients that are going stale with Stews! Soups too!
          codes:
          - COO+1
          - BOR-1
        - text: Don't use anything Rotten though, unless you're a really skilled Cook.
        - text: You'll only be able to save small amounts of Rotting foods to use.
        - text: So they may not be worth the effort if you have something else.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E4
        itemDisplayName: "VHS: Cooking With Gas E4"
        title: Cooking
        subtitle: "Episode 4: Stir Fry"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we are going to make some Stir Fry with Rabbit Meat!
        - text: Wayne brought us some rabbit meat even though he is scared of rabbits.
        - text: "Wayne Offscreen: I'm not scared of the rabbits. I'm scared of Rabies dude."
        - text: Fair enough. Rabies is scary. I wouldn't want to catch anything like it.
          codes:
          - COO+1
          - BOR-1
        - text: For this dish you want to be cooking with a Frying Pan.
        - text: Go ahead and throw in your Rabbit Meat first and pick out your vegetables.
        - text: Today we've got Leek, Onion and Zuccini to go in our Rabbit Meat Stir Fry.
        - text: Go ahead and grill it up until the Rabbit Meat is safe to eat.
          codes:
          - COO+1
          - BOR-1
        - text: Now you can enjoy a good hearty meal with friends.
        - text: You can use plenty of ingredients in your Stir Fry.
        - text: Lots of different meats and veggies can be added.
        - text: You can even use Frog Meat in your Stir Fry. We have before.
          codes:
          - COO+1
          - BOR-1
        - text: You know around here we do the Subsistence living.
        - text: Our meat is from hunting, or veggies from growing.
        - text: We're just a bunch of old Survivalists making do.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E5
        itemDisplayName: "VHS: Cooking With Gas E5"
        title: Cooking
        subtitle: "Episode 5: Pancakes"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: I eat a lot of Soup and Stew out here on The Homestead.
        - text: Something I don't get a chance to make a lot are Pancakes.
        - text: Pancakes are magical and yes you absolutely can grill them!
        - text: I'll let you in on a little secret I found out recently too.
          codes:
          - COO+1
          - BOR-1
        - text: Even ghosts like to grill up some Pancakes. I've seen it.
        - text: The guys and I have been out all day and come home to some
        - text: mysterious Pancakes already sitting on the grill waiting.
        - text: We all swear up and down it wasn't us that did it.
          codes:
          - COO+1
          - BOR-1
        - text: It is a nice surprise though to come home to grilled Pancakes.
        - text: And I believe the guys that they're not making the Pancakes.
        - text: They don't ever do any Cooking. That's my job and they're lazy.
        - text: I'm not making them, as much as I love grilling Pancakes.
          codes:
          - COO+1
          - BOR-1
        - text: I just don't have the ingredients to make them that often!
        - text: But I do appreciate the Pancake making Ghosts though.
        - text: Been starving more than once after a run and come home to easy Pancakes.
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
      - key: SMR_Cooking-E6
        itemDisplayName: "VHS: Cooking With Gas E6"
        title: Cooking
        subtitle: "Episode 6: Drinks"
        lines:
        - text: Cooking With Gas!
          icon: music
        - text: Welcome to Cooking With Gas! Your guide to Good Eats!
        - text: I'm Paul and I love Cooking With Gas! BBQ grilling!
          codes:
          - COO+1
          - BOR-1
        - text: Today we're doing something different. We're making drinks!
        - text: Now this drink is a great one to make on a hard day.
        - text: Say you come back from a run and you're a bit stressed.
        - text: What you need is a Hot Cuppa. Yessir it will fix you right up.
          codes:
          - COO+1
          - BOR-1
        - text: You can use either Coffee or Tea Bags. You're gonna need Sugar.
        - text: Now we don't keep a lot of Sugar on hand so it's a rare treat.
        - text: Go ahead and fill a Kettle full of water and let it grill.
        - text: You want hot water for your Cuppa Coffee or Tea.
          codes:
          - COO+1
          - BOR-1
        - text: Once that water is nice and hot take an Empty Mug and some Sugar
        - text: to the grill and fix up a Hot Cuppa to enjoy and fix you up.
        - text: You can always make a Cold Cuppa but I don't see why you would.
        - text: When you're Cooking With Gas your food and drink are always hot!
          codes:
          - COO+1
          - BOR-1
        - text: Now if you have a bunch of Sugar I suggest you make this stuff often.
        - text: It will keep you warm and happy, and hopefully a little more stress free.
        - text: So you can spend more time Cooking With Gas!
        - text: That's all for today. We'll catch you next time fellas.
          codes:
          - COO+1
          - BOR-1
        - text: Cooking With Gas!
          icon: music
    electrical:
      vanilla XP: 150
      reels:
      - key: SMR_Electrical-E1
        itemDisplayName: "VHS: This Old Generator E1"
        title: Electrical
        subtitle: "Episode 1: Dismantling Lights"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're going to be talking about dismantling lights.
        - text: Your neighbor's house is full of lamps just waiting for you.
        - text: Go over there and dismantle some. All you need is a screwdriver.
        - text: We talked about getting in safely on This Old Trailer, remember?
          codes:
          - ELC+1
          - BOR-1
        - text: Once you're in there stay quiet so you don't alert any neighbors.
        - text: Dismantle some lights and be sure to keep all the light bulbs.
        - text: You will need those bulbs for making your own electronics later!
        - text: Now you may need a hammer for some of the lights attached onto walls.
          codes:
          - ELC+1
          - BOR-1
        - text: There is lots of stuff out there to dismantle for parts so keep an eye out.
        - text: All of those parts will help a lot in crafting your own gadgets.
        - text: So be sure to dismantle everything you can and save up supplies!
        - text: You never know when you will need a motion activated pipe bomb.
          codes:
          - ELC+1
          - BOR-1
        - text: Next episode we're going to talk about radios and their parts!
        - text: That's all for today! We'll see you next time!
        - text: Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E2  
        itemDisplayName: "VHS: This Old Generator E2"
        title: Electrical
        subtitle: "Episode 2: Dismantling Radios"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're going to be talking about radios and parts.
        - text: There are lots of radios out there so no need to dismantle your own.
        - text: Go fetch your neighbor's radio and get out your trusty screwdriver.
        - text: Lets get started taking this radio apart. There are lots of good parts here.
          codes:
          - ELC+1
          - BOR-1
        - text: Aluminum, good for making hats and other stuff. Some electric wire here.
        - text: A bit of electronic scrap. The guts for all our gadgets so keep every scrap of it!
        - text: Now if you've got some skill you should be able to salvage the receiver. We got one here.
        - text: These are good for remote triggers and fixing up your own radios in your trailer.
          codes:
          - ELC+1
          - BOR-1
        - text: I'm saving up some to make remote pipe bombs to protect my plank stash.
        - text: Now you should also get some batteries out of the radios you dismantle.
        - text: Toss the dead ones but keep every good battery you find. You will need them.
        - text: Nothing worse than wanting to listen to your radio and not having any batteries.
          codes:
          - ELC+1
          - BOR-1
        - text: You may also get an Amplifier if you're a skilled electrician. Keep it.
        - text: Those are good for noise makers to distract any pesky neighbors.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E3
        itemDisplayName: "VHS: This Old Generator E3"
        title: Electrical
        subtitle: "Episode 3: Dismantling TVs"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're talking about dismantling TVs for parts.
        - text: Much like radios, we've got a bunch of good parts available.
        - text: No need to mess up your own TV, go get your neighbor's TV.
        - text: All you'll need is your trusty screwdriver for this job.
          codes:
          - ELC+1
          - BOR-1
        - text: Start taking that TV apart for all those electronic scraps!
        - text: You'll get more aluminum, electric wire and maybe an amplifier!
        - text: Don't forget to keep those electronic scraps safe in your stash.
        - text: Now that you've got that TV dismantled and your scrap safe, crack open a beer.
          codes:
          - ELC+1
          - BOR-1
        - text: Celebrate by making yourself a nice aluminum hat. It keeps the neighbors out.
        - text: Dismantling TVs is a fun past-time and makes you a true patriot.
        - text: Taking away the fake news man's platform so he can't spread lies.
        - text: Doing God's work right there. Damn government propagandas on my TV.
          codes:
          - ELC+1
          - BOR-1
        - text: Take that you damn fake news man! Power to the people you communist!
        - text: Anyway, next time we'll be talking about Electronic Scraps in depth.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E4
        itemDisplayName: "VHS: This Old Generator E4"
        title: Electrical
        subtitle: "Episode 4: Electronic Scrap"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're talking about Electronic Scrap!
        - text: This stuff is the guts of every gadget you will make.
        - text: So be sure to gather lots of it from your neighbor's electronics.
        - text: These scraps are good for making your own radio and tv.
          codes:
          - ELC+1
          - BOR-1
        - text: You can also use them for making noisemakers and traps.
        - text: You'll want to be sure to check your neighbor's bookcases,
        - text: you can find some great magazines to teach you some gadgets.
        - text: And all of them require Electronic Scraps. Lucky we have lots.
          codes:
          - ELC+1
          - BOR-1
        - text: If you're not slacking, you should have lots by now too.
        - text: Try out making some gadgets with your scraps and spare parts.
        - text: You will be amazed at how versatile these Electronic Scraps are!
        - text: I use mine for making pipe bombs and pipe bomb accessories.
          codes:
          - ELC+1
          - BOR-1
        - text: Good traps for when pesky neighbors are poking around.
        - text: Or just a fun time for letting off some stress. Boom! Hahaha.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E5
        itemDisplayName: "VHS: This Old Generator E5"
        title: Electrical
        subtitle: "Episode 5: Generators"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're talking about Generators and keeping them repaired.
        - text: Now before you start working on a Generator you need some skills.
        - text: By now you should have found the magazine How To Use Generators
        - text: If you haven't yet, check your neighbor's bookcases. Might get lucky.
          codes:
          - ELC+1
          - BOR-1
        - text: You can also burgle the local book store if you're feeling frisky.
        - text: Now, Generators are found in warehouses and your neighbor's shed.
        - text: They're heavy so make a plan on how to get it back to your trailer.
        - text: Now take some Electronic Scraps out of your stash, we're going to use them.
          codes:
          - ELC+1
          - BOR-1
        - text: We need them to repair Generators so hopefully your stash isn't empty.
        - text: Keep your Generators in good working order and properly setup OUTSIDE!
        - text: Those fumes will kill you. So will the fire from a broken Generator.
        - text: Yeah lots of fire. That's how my pa died. *Eyes tearing up*
          codes:
          - ELC+1
          - BOR-1
        - text: "*Thousand yard stare* I'll never forget to repair another Generator."
        - text: Ever again. I'm Sorry Jesus. Please don't send me to Hell for killing Pa.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
      - key: SMR_Electrical-E6
        itemDisplayName: "VHS: This Old Generator E6"
        title: Electrical
        subtitle: "Episode 6: Noisemakers"
        lines:
        - text: This Old Generator
          icon: music
        - text: Hi I'm Jim-Bob and welcome to This Old Generator!
        - text: Our new electrician show about generators and such!
          codes:
          - ELC+1
          - BOR-1
        - text: Today we're going to talk about noisemakers
        - text: We've mentioned them before but haven't gone in depth.
        - text: These handy little traps are a bit pricey to make costing 7 scraps.
        - text: Worth every single one though. Throw them somewhere you want everyone to be.
          codes:
          - ELC+1
          - BOR-1
        - text: And watch all your neighbors come running to check it out!
        - text: You'll need an amplifier for these babies but that should be easy.
        - text: By now your stash of scraps and parts should have plenty of them.
        - text: If not, you're seriously slacking and need to break some radios and TVs.
          codes:
          - ELC+1
          - BOR-1
        - text: Keep your stash well stocked so you can crank out these noisemakers.
        - text: You'll never be bothered by another pesky neighbor while borrowing their stuff.
        - text: Make every supply run go smoothly! Or you can be a bit naughty with them.
        - text: Throw them at your friends and watch the neighbors go wild tearing them apart.
          codes:
          - ELC+1
          - BOR-1
        - text: Seriously nobody likes these things, they're loud as all hell.
        - text: They'll make your damn ears bleed. Hell of a headache.
        - text: That's all for today. Remember, AC/DC ain't just about rockin' out!
        - text: This is Jim-Bob signing off!
          codes:
          - ELC+1
          - BOR-1
        - text: This Old Generator
          icon: music
    glassmaking:
    knapping:
      reels:
      - key: SMR_Knapping-E1
        itemDisplayName: "VHS: Knapping: The Ancient Art E1"
        title: Knapping
        subtitle: "Episode 1: Finding the Nodule"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to the wilderness of Kentucky.
        - text: The modern world is gone but nature still provides.
          codes:
          - KNP+1
          - BOR-1
        - text: Today we learn the ancient ways of stone crafting.
        - text: Keep your eyes on the ground when you are foraging.
        - text: Look closely along the riverbeds and forest paths.
          codes:
          - KNP+1
          - BOR-1
        - text: You are searching for rough gray flint nodules.
        - text: Pick them up and bring them to your crafting surface.
        - text: You will need a sturdy hammer to strike the stone.
          codes:
          - KNP+1
          - BOR-1
        - text: Hold the flint nodule firmly against the wood.
        - text: Strike the edge at a clean downward angle.
        - text: Let the hammer blow fracture the rock naturally.
          codes:
          - KNP+1
          - BOR-1
        - text: Small sharp flint flakes will break right off.
        - text: These flakes are sharp enough to slice through skin.
        - text: They will serve as the base for all your tools.
          codes:
          - KNP+1
          - BOR-1
        - text: Keep practicing and stay safe in the woods.
        - text: Join us next time on The Ancient Art.
        - text: "Knapping: The Ancient Art!"
          icon: music
      - key: SMR_Knapping-E2
        itemDisplayName: "VHS: Knapping: The Ancient Art E2"
        title: Knapping
        subtitle: "Episode 2: Simple Edges"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to our rustic Kentucky shelter.
        - text: Today we craft simple edges to survive the night.
          codes:
          - KNP+1
          - BOR-1
        - text: You will need a flat wooden crafting surface.
        - text: Grab your hammer and those sharp flint flakes.
        - text: We will shape these stones into reliable tools.
          codes:
          - KNP+1
          - BOR-1
        - text: First let us carve out a basic stone chisel.
        - text: Place the flake down and tap the hammer gently.
        - text: Carefully strike the edge to form a sharp bevel.
          codes:
          - KNP+1
          - BOR-1
        - text: This chisel is perfect for your masonry projects.
        - text: Next we will knap a needle-like stone awl.
        - text: Flake the sides until it tapers to a fine point.
          codes:
          - KNP+1
          - BOR-1
        - text: Use it to pierce leather or drill through wood.
        - text: Finally we can fashion a wicked stone blade.
        - text: Slice and shave your way through the local brush.
          codes:
          - KNP+1
          - BOR-1
        - text: Stay quiet and keep your eyes on the treeline.
        - text: Join us next time on The Ancient Art.
        - text: "Knapping: The Ancient Art!"
          icon: music
      - key: SMR_Knapping-E3
        itemDisplayName: "VHS: Knapping: The Ancient Art E3"
        title: Knapping
        subtitle: "Episode 3: Teeth of Stone"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to our quiet Kentucky woodland.
        - text: The shadows are growing longer every day.
          codes:
          - KNP+1
          - BOR-1
        - text: You need real tools to build a proper shelter.
        - text: A simple stone blade will not cut thick timber.
        - text: We must craft a saw with teeth made of stone.
        - text: First you must find a modern saw to study.
          codes:
          - KNP+1
          - BOR-1
        - text: Search the local tool sheds and wooden crates.
        - text: Research a steel hacksaw or a common hand saw.
        - text: Study the metal teeth to learn their pattern.
        - text: Now grab your hammer and a fresh flint flake.
          codes:
          - KNP+1
          - BOR-1
        - text: Set your materials down on the crafting surface.
        - text: Strike the edge to flake away small grooves.
        - text: Space each tooth evenly along the stone edge.
        - text: Soon you will have a functional flint saw.
          codes:
          - KNP+1
          - BOR-1
        - text: Use it to cut wooden logs into sturdy planks.
        - text: It is a primitive way to master carpentry.
        - text: Keep your camp hidden and your hammer ready.
        - text: Join us next time on The Ancient Art.
          codes:
          - KNP+1
          - BOR-1
        - text: "Knapping: The Ancient Art!"
          icon: music
      - key: SMR_Knapping-E4
        itemDisplayName: "VHS: Knapping: The Ancient Art E4"
        title: Knapping
        subtitle: "Episode 4: The Heavy Axe"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to our quiet Kentucky camp.
        - text: The trees are tall and the winter is cold.
          codes:
          - KNP+1
          - BOR-1
        - text: You will need heavy lumber to build a home.
        - text: A small flint saw just will not cut it now.
        - text: Today we knap a powerful stone axe head.
        - text: First go foraging for a large flat stone.
          codes:
          - KNP+1
          - BOR-1
        - text: Look for smooth gray river rocks on the ground.
        - text: Bring your hammer to the wooden work surface.
        - text: Hold the smooth stone firmly with your hand.
        - text: Strike the flat face to clear the rough edges.
          codes:
          - KNP+1
          - BOR-1
        - text: Deliver solid blows near the bottom corner.
        - text: Be careful not to shatter the main body.
        - text: Slowly a heavy wedge shape begins to form.
        - text: Smooth it out until the edge is razor sharp.
          codes:
          - KNP+1
          - BOR-1
        - text: This stone axe will fell the thickest trees.
        - text: It might also save you from a nasty bite.
        - text: Keep your tools clean and your camp hidden.
        - text: Join us next time on The Ancient Art.
          codes:
          - KNP+1
          - BOR-1
        - text: "Knapping: The Ancient Art!"
          icon: music
      - key: SMR_Knapping-E5
        itemDisplayName: "VHS: Knapping: The Ancient Art E5"
        title: Knapping
        subtitle: "Episode 5: Borers and Beaters"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to our quiet Kentucky workshop.
        - text: The dead are walking but we must keep working.
          codes:
          - KNP+1
          - BOR-1
        - text: Today we construct advanced utility gear.
        - text: First we will craft a primitive stone drill.
        - text: Study a steel hand drill or common auger.
        - text: You will need a stone chisel for this task.
          codes:
          - KNP+1
          - BOR-1
        - text: Set your flint nodule on the wooden surface.
        - text: Use any heavy hammer to strike the center.
        - text: Carefully bore a clean hole through the stone.
        - text: Now let us make the deadly stone maul head.
          codes:
          - KNP+1
          - BOR-1
        - text: Reach level four and grab a smooth flat stone.
        - text: Deliver a massive blow with your club hammer.
        - text: Whittle the sides into a heavy blunt wedge.
        - text: This crushing weapon will shatter any skull.
          codes:
          - KNP+1
          - BOR-1
        - text: One swing can stop a charging zombie cold.
        - text: Keep your camp secure and your tools sharp.
        - text: Join us next time on The Ancient Art.
        - text: Happy knapping and stay safe out there.
          codes:
          - KNP+1
          - BOR-1
        - text: "Knapping: The Ancient Art!"
          icon: music
      - key: SMR_Knapping-E6
        itemDisplayName: "VHS: Knapping: The Ancient Art E6"
        title: Knapping
        subtitle: "Episode 6: The Long Blade"
        lines:
        - text: "Knapping: The Ancient Art!"
          icon: music
        - text: Welcome back to our quiet Kentucky forest.
        - text: The dead are scratching at the cabin door.
          codes:
          - KNP+1
          - BOR-1
        - text: You need a weapon with some serious reach.
        - text: A short blade forces you to get too close.
        - text: Today we master the ultimate knapping craft.
        - text: We will knap a deadly long stone blade.
          codes:
          - KNP+1
          - BOR-1
        - text: First study a standard stone blade closely.
        - text: This research unlocks the advanced recipe.
        - text: Grab a large smooth flat stone to begin.
        - text: Place your materials on the work surface.
          codes:
          - KNP+1
          - BOR-1
        - text: Tap the flat stone with a heavy hammer.
        - text: Strike the edges at a steep downward angle.
        - text: Thin out the sides to make it razor sharp.
        - text: Whittle the base to fit a wooden handle.
          codes:
          - KNP+1
          - BOR-1
        - text: This long blade keeps the dead at a distance.
        - text: Keep your tools sharp and your camp secure.
        - text: Join us next time on The Ancient Art.
        - text: Happy knapping and stay safe out there.
          codes:
          - KNP+1
          - BOR-1
        - text: "Knapping: The Ancient Art!"
          icon: music

    masonry:
      reels:
      - key: SMR_Masonry-E1
        itemDisplayName: "Masonry: Solid as Stone E1"
        title: Masonry
        subtitle: "Episode 1: Clay and Chemistry"
        lines:
        - text: "Masonry: Solid as Stone!"
          icon: music
        - text: Welcome back to our quiet Kentucky homestead.
        - text: The dead are wandering down the gravel roads.
          codes:
          - MSN+1
          - BOR-1
        - text: We must build strong walls to keep them out.
        - text: Today we learn to forage for raw sticky clay.
        - text: Search the riverbanks and low muddy ditches.
        - text: Dig deep into the dirt with your bare hands.
          codes:
          - MSN+1
          - BOR-1
        - text: Fill your heavy sacks with this gray earth.
        - text: Carry the clay back to your secure workspace.
        - text: Now we must mix a perfect binding mortar.
        - text: Blend the smooth clay with fine creek sand.
          codes:
          - MSN+1
